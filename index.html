<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<!-- 注意：这个标题就是微信里转发时预览卡片上显示的文字。
     千万不要写成「给你的一封信」之类，否则她还没点开就知道是什么了。
     要保持「就是个小游戏」的错觉。 -->
<title>你能通三关吗？</title>
<meta name="description" content="三个小关卡，看看你能过几关。">
<meta property="og:title" content="你能通三关吗？">
<meta property="og:description" content="三个小关卡，看看你能过几关。">
<meta property="og:type" content="website">
<script>
/* 兜底诊断：脚本一旦报错就在页面底部显示出来，方便截图反馈。
   这里刻意用最老的 ES5 语法写，保证在旧浏览器里也能正常显示。
   一切正常时它永远不会出现。 */
(function () {
  function show(msg) {
    try {
      var bar = document.getElementById('__errbar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = '__errbar';
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;'
          + 'background:rgba(58,13,28,.97);color:#ffd6e8;'
          + 'font:11px/1.6 Consolas,monospace;padding:9px 12px;'
          + 'word-break:break-all;border-top:1px solid #ff6b9d';
        var host = document.body || document.documentElement;
        host.appendChild(bar);
      }
      bar.innerHTML += (bar.innerHTML ? '<br>' : '') + '⚠ ' + msg;
    } catch (e) {}
  }
  window.onerror = function (msg, url, line, col) {
    show(msg + '  @' + line + ':' + col);
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    show('异步错误: ' + ((e.reason && e.reason.message) || e.reason));
  });
})();
</script>
<!--
  ════════════════════════════════════════════════
   表白网页 · 使用说明
   1. 用记事本 / VS Code 打开本文件
   2. 找到下面的 CONFIG（大约在第 40 行）
      改掉 to / from / letterLines / question / games 等内容
   3. 保存后双击打开即可（推荐 Chrome / Edge / Safari）
   4. 想加背景音乐：把 mp3 放在同目录，命名 bgm.mp3
  ════════════════════════════════════════════════
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root{
    --pink:#ff6b9d;
    --pink-soft:#ffa8c5;
    --rose:#ffd6e8;
    --deep:#150a26;
    --text:#fff3f8;
  }

  html,body{ height:100%; overflow:hidden; }

  body{
    background: radial-gradient(120% 90% at 50% 0%, #3a1c5c 0%, #241040 35%, #150a26 70%, #0b0514 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }

  #bg{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* 边缘暗角，让画面更有氛围 */
  .vignette{
    position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(75% 65% at 50% 45%, transparent 40%, rgba(6,2,14,.75) 100%);
  }

  /* ───────── 场景容器 ───────── */
  .scene{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    opacity:0; visibility:hidden;
    transform: scale(.96);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1), visibility .7s;
    z-index:2;
  }
  .scene.active{ opacity:1; visibility:visible; transform:scale(1); }

  /* ───────── 玻璃卡片 ───────── */
  .card{
    width:min(560px, 100%);
    max-height: calc(100vh - 60px);
    overflow-y:auto;
    padding: 34px 28px 30px;
    border-radius: 26px;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
    border: 1px solid rgba(255,182,213,.28);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    text-align:center;
    scrollbar-width:none;
  }
  .card::-webkit-scrollbar{ display:none; }

  /* ───────── 开场 ───────── */
  .envelope{ font-size:62px; line-height:1; margin-bottom:18px; animation: float 3s ease-in-out infinite; }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-10px) } }

  h1{ font-size:clamp(22px,5.6vw,28px); font-weight:700; letter-spacing:.5px;
      background:linear-gradient(92deg,#fff 10%, var(--pink-soft) 45%, var(--pink) 90%);
      -webkit-background-clip:text; background-clip:text; color:transparent; }

  .sub{ margin-top:12px; font-size:14px; color:rgba(255,214,232,.62); letter-spacing:.5px; }

  /* ───────── 按钮 ───────── */
  .btn{
    margin-top:26px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding: 15px 40px;
    font-size:17px; font-weight:600; font-family:inherit;
    color:#fff; cursor:pointer; border:none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff7fae, #ff4f8b 55%, #e5306e);
    box-shadow: 0 12px 30px rgba(255,79,139,.45), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .25s cubic-bezier(.22,1.6,.4,1), box-shadow .25s, opacity .4s;
    position:relative;
  }
  .btn:hover{ transform: translateY(-3px) scale(1.04); box-shadow: 0 18px 40px rgba(255,79,139,.6); }
  .btn:active{ transform: scale(.96); }
  .btn.ghost{
    background: transparent; color: rgba(255,214,232,.85);
    border:1px solid rgba(255,182,213,.4); box-shadow:none;
    font-weight:500; font-size:15px; padding:13px 30px;
  }
  .btn.ghost:hover{ background: rgba(255,182,213,.12); box-shadow:none; transform:translateY(-2px); }

  /* ───────── 打字机情书 ───────── */
  #letterBox{ text-align:left; margin-top:6px; min-height: 190px; }
  #letterBox .line{
    font-size: clamp(15px, 4.2vw, 17px);
    line-height: 2;
    color: #ffeaf3;
    opacity:0; transform: translateY(10px);
    animation: rise .6s ease forwards;
    text-shadow: 0 2px 16px rgba(255,107,157,.28);
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) } }

  .cursor{
    display:inline-block; width:2px; height:1em; margin-left:3px;
    background: var(--pink); vertical-align:-2px;
    animation: blink .85s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0 } }

  /* ───────── 表白场景 ───────── */
  .bigAsk{
    font-size: clamp(21px, 6vw, 27px); font-weight:700; line-height:1.65;
    background:linear-gradient(92deg,#fff, var(--pink-soft) 50%, var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .askEmoji{ font-size:52px; display:block; margin-bottom:14px; animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{ transform:scale(1) } 12%{ transform:scale(1.18) } 24%{ transform:scale(1) } 36%{ transform:scale(1.12) } }

  .btnRow{
    margin-top:30px; display:flex; gap:14px; justify-content:center;
    align-items:center; flex-wrap:wrap; min-height:60px;
  }
  #yesBtn{ transition: transform .35s cubic-bezier(.22,1.6,.4,1), font-size .35s, padding .35s; }
  #noBtn{
    transition: transform .18s ease-out, opacity .5s, font-size .35s;
    z-index:99; white-space:nowrap;
  }
  #noBtn.fixed{ position:fixed; margin:0; }

  /* ───────── 结局 ───────── */
  .finalTitle{
    font-size: clamp(24px, 7vw, 34px); font-weight:800; letter-spacing:1px;
    background:linear-gradient(92deg,#ffd6e8,#ff6b9d 55%,#ff2d6f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .finalText{ margin-top:16px; font-size:clamp(14px,4vw,16px); line-height:2; color:rgba(255,235,243,.92); }
  .stamp{
    margin-top:24px; padding-top:18px;
    border-top:1px dashed rgba(255,182,213,.3);
    font-size:13px; color:rgba(255,214,232,.62); line-height:1.9; letter-spacing:.6px;
  }
  .stamp .names{ font-size:15px; color:#ffc2d9; font-weight:600; letter-spacing:1px; }

  /* ───────── 小游戏 ───────── */
  .gameHud{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:12px; font-size:13px; color:rgba(255,214,232,.8);
    letter-spacing:.5px;
  }
  .hudItem{ display:flex; align-items:center; gap:5px; }
  .hudItem b{ color:#ff9dc0; font-size:15px; }

  #gameWrap{
    position:relative; border-radius:18px; overflow:hidden;
    border:1px solid rgba(255,182,213,.22);
    background: radial-gradient(100% 80% at 50% 0%, rgba(255,107,157,.10), rgba(255,255,255,.015));
  }
  /* 三个关卡共用一个舞台，一次只显示一个 */
  .stagePane{
    position:relative; width:100%; height:min(46vh, 330px); min-height:220px;
    display:none;
  }
  .stagePane.on{ display:block; }
  #gameCanvas{
    display:block; width:100%; height:100%;
    touch-action:none; cursor:none;
  }

  /* ── 第 2 关：打地鼠 ── */
  #moleStage{ padding:14px; box-sizing:border-box; }
  .moleGrid{
    display:grid; grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr); gap:10px; width:100%; height:100%;
  }
  .hole{
    position:relative; border-radius:15px; overflow:hidden; cursor:pointer;
    touch-action:manipulation; user-select:none; -webkit-tap-highlight-color:transparent;
    border:1px solid rgba(255,255,255,.09);
    background: radial-gradient(circle at 50% 86%, rgba(0,0,0,.55) 0 32%, rgba(255,255,255,.055) 34%, rgba(255,255,255,.025) 100%);
    display:flex; align-items:flex-end; justify-content:center;
    transition:background .15s;
  }
  .hole.hit{ background: radial-gradient(circle at 50% 86%, rgba(120,255,190,.30) 0 34%, rgba(255,255,255,.06) 36%, rgba(255,255,255,.02) 100%); }
  .mole{
    font-size:31px; line-height:1; pointer-events:none;
    transform:translateY(118%);
    transition:transform .13s cubic-bezier(.2, 1.7, .5, 1);
  }
  .hole.up .mole{ transform:translateY(8%); }

  /* ── 第 3 关：翻牌配对 ── */
  #memStage{ padding:16px; box-sizing:border-box; }
  #memStage.on{ display:flex; align-items:center; justify-content:center; }
  .memGrid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:9px;
    width:100%; max-width:320px; align-content:center;
  }
  /* 卡片必须有真实高度：靠宽高比撑开，否则百分比高度会塌成 0 */
  .card3d{ aspect-ratio:3 / 4; perspective:620px; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .cardInner{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .42s cubic-bezier(.4, 1.25, .5, 1);
  }
  .card3d.flip .cardInner{ transform:rotateY(180deg); }
  .cardFace{
    position:absolute; inset:0; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    font-size:25px; line-height:1;
  }
  .cardBack{
    background:linear-gradient(150deg, rgba(124,94,196,.55), rgba(58,38,108,.8));
    border:1px solid rgba(255,255,255,.17); color:rgba(255,255,255,.3); font-size:17px;
  }
  .cardFront{
    transform:rotateY(180deg); color:#ffe3ef;
    background:linear-gradient(150deg, rgba(255,255,255,.17), rgba(255,255,255,.06));
    border:1px solid rgba(255,182,213,.3);
  }
  .card3d.matched{ animation:cardPop .34s ease; }
  .card3d.matched .cardFront{ border-color:rgba(120,255,190,.55); }
  @keyframes cardPop{ 0%{transform:scale(1)} 45%{transform:scale(1.13)} 100%{transform:scale(1)} }
  /* 反转瞬间：所有牌一起变成爱心 */
  .card3d.reveal .cardFront{
    color:#ff4f8b; border-color:rgba(255,79,139,.8);
    text-shadow:0 0 16px rgba(255,79,139,.95);
    background:linear-gradient(150deg, rgba(255,79,139,.34), rgba(255,79,139,.12));
    transition:color .5s, border-color .5s, background .5s;
  }

  /* ── 反转时的满屏粉光 ── */
  #glitchFlash{
    position:fixed; inset:0; z-index:80; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 46%, rgba(255,79,139,.62), rgba(255,79,139,0) 68%);
  }
  #glitchFlash.on{ animation:glitchFlash 1.5s ease forwards; }
  @keyframes glitchFlash{ 0%{opacity:0} 16%{opacity:1} 100%{opacity:0} }

  .gameMask{
    position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:20px;
    text-align:center; background:rgba(16,7,30,.78);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity:0; visibility:hidden; transition:opacity .35s, visibility .35s;
  }
  .gameMask.show{ opacity:1; visibility:visible; }
  .gameMask h3{ font-size:19px; font-weight:700; color:#ffd6e8; }
  .gameMask p{ font-size:13.5px; line-height:1.9; color:rgba(255,214,232,.72); max-width:300px; }

  /* ───────── 恭喜通关（中性游戏结算，不能有一点粉色爱心）───────── */
  .gameMask.victory h3{
    font-size:28px; letter-spacing:1px;
    background:linear-gradient(135deg,#fff6cf,#ffc857 52%,#ffa62e);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:#ffc857;
    animation:vPop .55s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes vPop{ from{ transform:scale(.6); opacity:0 } to{ transform:scale(1); opacity:1 } }
  .gameMask.victory p{ max-width:212px; }
  .gameMask .vRow{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:20px; padding:2px 0; font-size:14px; line-height:1.75;
  }
  .gameMask .vRow i{ font-style:normal; color:rgba(255,214,232,.55); }
  .gameMask .vRow b{
    color:#ffd76e; font-weight:700; font-size:16px;
    font-variant-numeric:tabular-nums;
  }
  .gameMask .vSub{
    display:block; font-size:12.5px; letter-spacing:2px;
    color:rgba(255,214,232,.5); margin-bottom:6px;
  }
  .gameTip{ margin-top:12px; font-size:12.5px; color:rgba(255,214,232,.45); line-height:1.8; }

  /* ───────── 音乐按钮 ───────── */
  #musicBtn{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); right:16px; z-index:50;
    width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,182,213,.35);
    background: rgba(255,255,255,.08); backdrop-filter: blur(10px);
    color:#ffd6e8; font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .25s, background .25s;
  }
  #musicBtn:hover{ transform: scale(1.1); background: rgba(255,255,255,.16); }
  #musicBtn.paused{ opacity:.5; }

  .hint{
    position:fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left:0; right:0;
    text-align:center; font-size:12px; color: rgba(255,214,232,.3);
    pointer-events:none; z-index:3; letter-spacing:.5px;
  }

  @media (max-width:420px){
    .card{ padding:28px 20px 24px; border-radius:22px; }
    .btnRow{ gap:10px; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="vignette"></div>

<!-- 背景音乐文件：把歌放到同目录命名 bgm.mp3 即可自动启用；没有该文件会自动回退到内置音乐 -->
<audio id="bgm" loop preload="auto" playsinline></audio>

<button id="musicBtn" class="paused" title="播放/暂停音乐">🔇</button>

<!-- ══════════ 场景 1：小游戏（三关，页面入口） ══════════ -->
<section class="scene active" id="sceneGame">
  <div class="card">
    <div class="gameHud">
      <div class="hudItem" id="hudStage">小游戏</div>
      <div class="hudItem"><span id="hudALabel">★</span> <b id="hudScore">0</b></div>
      <div class="hudItem"><span id="hudBLabel">⏱</span> <b id="hudTime">0</b><span id="hudBUnit">s</span></div>
    </div>

    <div id="gameWrap">
      <div class="stagePane on" id="catchStage"><canvas id="gameCanvas"></canvas></div>
      <div class="stagePane" id="moleStage"><div class="moleGrid" id="moleGrid"></div></div>
      <div class="stagePane" id="memStage"><div class="memGrid" id="memGrid"></div></div>

      <div class="gameMask show" id="gameMask">
        <h3 id="maskTitle">小游戏</h3>
        <p id="maskText">一共三关，每关玩法都不一样。<br>准备好了就点开始吧。</p>
        <button class="btn" id="maskBtn">开始</button>
      </div>
    </div>

    <p class="gameTip" id="gameTip">一共三关，每关玩法都不一样。</p>
  </div>
</section>

<!-- ══════════ 场景 3：情书 ══════════ -->
<section class="scene" id="sceneLetter">
  <div class="card">
    <div id="letterBox"></div>
    <button class="btn" id="toAskBtn" style="display:none">还有一句话…</button>
  </div>
</section>

<!-- ══════════ 场景 4：表白 ══════════ -->
<section class="scene" id="sceneAsk">
  <div class="card">
    <span class="askEmoji">💗</span>
    <p class="bigAsk" id="askText">你愿意，做我的女朋友吗？</p>
    <div class="btnRow" id="btnRow">
      <button class="btn" id="yesBtn">愿意 ❤️</button>
      <button class="btn ghost" id="noBtn">再想想</button>
    </div>
  </div>
</section>

<!-- ══════════ 场景 5：结局 ══════════ -->
<section class="scene" id="sceneFinal">
  <div class="card">
    <div class="envelope">🎉</div>
    <div class="finalTitle" id="finalTitle">我就知道 ❤️</div>
    <p class="finalText" id="finalText"></p>
    <div class="stamp">
      <div class="names" id="stampNames"></div>
      <div id="stampDate"></div>
      <div style="margin-top:8px">截图保存这一刻，以后每年都翻出来看看 📸</div>
    </div>
    <button class="btn ghost" id="replayBtn" style="margin-top:20px">再看一遍 ↺</button>
  </div>
</section>

<div id="glitchFlash"></div>
<div class="hint">Made with ❤️</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ★★★  配置区：想改什么，改这里就够了  ★★★
   ═══════════════════════════════════════════════════════════ */
const CONFIG = {
  // 她的名字 / 你的名字
  to:   '小可爱',
  from: '我',

  /* 情书内容（一段一行，会逐字打出来，{to} 会替换成她的名字）
     ── 写的是「说出来」的话，不是「写出来」的话：短句、口语、不押韵、不对仗。
        如果某句和事实不符，直接改（比如第 4 段「那地方我一点都不熟」）。 */
  letterLines: [
    '{to}，对不起——刚才那个游戏，是骗你的。',
    '我不是想让你玩什么游戏。我就是想找个理由，让你多待一会儿。',
    '这事我憋了挺久了。',
    '我专门跑过你那个小县城。那地方我一点都不熟。',
    '可我在那儿待着特别舒服。因为你在。',
    '电玩城、电影院、商场，我们也没干什么特别的。可回来以后，我老是想起那几天。',
    '每次见你，我心里就特别安稳。不用说什么，你在旁边就行。',
    '我不知道你把我当什么，可能只是朋友。但我还是想让你知道——我喜欢你。',
    '你不用急着回答，也不用觉得有压力。这些话，我不想再瞒着你了。',
  ],

  /* ── 万能版情书 ──
     不含任何具体事件，发给谁都能用。网址后面加 ?v=wan 就会换成这一套。
     同样是照着「说出来而不是写出来」的原则写的。 */
  letterLinesWan: [
    '{to}，对不起——刚才那个游戏，是骗你的。',
    '我不是想让你玩什么游戏。我就是想找个理由，让你多待一会儿。',
    '这事我憋了挺久了。',
    '我发现自己总是想找你说话。没什么正事也想找你，你不回我就会一直看手机。',
    '你随口说过的一些小事，我居然都记得。有些连你自己都忘了吧。',

/* ── 两套情书 ──
   不带参数            = 专属版（写的是你们之间真实发生过的事）
   网址加 ?v=wan       = 万能版（不含具体事件，发给谁都能用）

/* ══════════════ 画布：星空 + 爱心粒子 ══════════════ */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

const stars = [];
const ambient = [];   // 背景缓缓上升的爱心
const bursts  = [];   // 烟花粒子

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
function buildStars(){
  stars.length = 0;
  const n = Math.round(W * H / 9000);
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + .3,
      a: Math.random() * .7 + .2,
      sp: Math.random() * .02 + .006,
      ph: Math.random() * Math.PI * 2
    });
  }
}
window.addEventListener('resize', resize);

/* 画一个爱心 */
function heart(c, x, y, s, rot, color, alpha){
  c.save();
  c.translate(x, y);
  c.rotate(rot || 0);
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, 0);
  c.bezierCurveTo(0, -s * .5, -s, -s * .55, -s, s * .3);
  c.bezierCurveTo(-s, s * .95, 0, s * 1.35, 0, s * 1.85);
  c.bezierCurveTo(0, s * 1.35, s, s * .95, s, s * .3);
  c.bezierCurveTo(s, -s * .55, 0, -s * .5, 0, 0);
  c.fill();
  c.restore();
}

/* 画一个四角星（游戏阶段用的中性粒子） */
function sparkle(c, x, y, s, rot, color, alpha){
  c.save();
  c.translate(x, y);
  c.rotate(rot || 0);
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, -s);
  c.quadraticCurveTo(0, 0, s, 0);
  c.quadraticCurveTo(0, 0, 0, s);
  c.quadraticCurveTo(0, 0, -s, 0);
  c.quadraticCurveTo(0, 0, 0, -s);
  c.fill();
  c.restore();
}

/* ── 背景往上飘的粒子 ──
   反转之前飘的是中性小星星（白 / 浅蓝 / 淡金 / 淡绿 / 淡紫），
   绝对不能用粉色爱心——否则整个游戏过程中背景都在暗示「这是表白」，
   等她玩到第三关，惊喜早就泄光了。
   反转的那一刻整片背景会一起变成爱心，落差才够大。 */
const AMBIENT_GAME_PAL = ['#ffffff','#cfe4ff','#ffe9a8','#a8f0c0','#d9c9ff'];
const AMBIENT_LOVE_PAL = ['#ff6b9d','#ffa8c5'];
let loveAmbient = false;          // 反转时置为 true

function spawnAmbient(){
  if (ambient.length > 34) return;
  const pal = loveAmbient ? AMBIENT_LOVE_PAL : AMBIENT_GAME_PAL;
  ambient.push({
    x: Math.random() * W,
    y: H + 30,
    s: Math.random() * 9 + 5,
    v: Math.random() * .35 + .18,
    drift: (Math.random() - .5) * .35,
    rot: (Math.random() - .5) * .5,
    a: Math.random() * .3 + .12,
    kind: loveAmbient ? 'heart' : 'star',
    hue: pal[(Math.random() * pal.length) | 0]
  });
}

/* 反转：场上所有小星星立刻变成爱心，之后新冒出来的也是爱心 */
function ambientToHearts(){
  loveAmbient = true;
  for (const p of ambient){
    p.kind = 'heart';
    p.hue = AMBIENT_LOVE_PAL[(Math.random() * 2) | 0];
  }
}

/* 粉色爱心调色板（反转时用） */
const PINK_PAL = ['#ff6b9d','#ffa8c5','#ffd6e8','#ff2d6f','#fff0f6','#ffc857'];
/* 中性游戏彩带调色板（恭喜通关时用）——只有金白青绿，
   一个粉色都没有。这一关必须让画面看起来「就是个游戏」，
   惊喜要留到她自己点「领取奖励」的那一刻。 */
const GAME_PAL = ['#ffd700','#ffffff','#7ee8fa','#ffe066','#a8f0c0','#c9d6ff','#ffb03a'];

function burst(x, y, count, palette, onlyType){
  const pal = palette || PINK_PAL;
  for (let i = 0; i < count; i++){
    const ang = Math.random() * Math.PI * 2;
    const sp  = Math.random() * 7 + 2.5;
    bursts.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 1.6,
      s: Math.random() * 7 + 4,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .22,
      life: 1,
      decay: Math.random() * .010 + .007,
      type: onlyType || (Math.random() < .55 ? 'heart' : 'confetti'),
      hue: pal[(Math.random() * pal.length) | 0]
    });
  }
}

let bgTick = 0;
function loop(){
  ctx.clearRect(0, 0, W, H);
  const t = bgTick++;

  // 星星
  for (const s of stars){
    const tw = s.a + Math.sin(t * s.sp + s.ph) * .35;
    ctx.globalAlpha = Math.max(.05, tw);
    ctx.fillStyle = '#ffeaf3';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 背景爱心
  if (t % 22 === 0) spawnAmbient();
  for (let i = ambient.length - 1; i >= 0; i--){
    const p = ambient[i];
    p.y -= p.v;
    p.x += Math.sin(t * .012 + p.y * .01) * .3 + p.drift * .2;
    if (p.kind === 'heart') heart(ctx, p.x, p.y, p.s, p.rot, p.hue, p.a);
    else                    sparkle(ctx, p.x, p.y, p.s * .62, p.rot, p.hue, p.a);
    if (p.y < -40) ambient.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // 烟花
  for (let i = bursts.length - 1; i >= 0; i--){
    const p = bursts[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += .16;        // 重力
    p.vx *= .992;
    p.rot += p.vr;
    p.life -= p.decay;

    if (p.life <= 0 || p.y > H + 60){
      bursts.splice(i, 1);
      continue;
    }
    if (p.type === 'heart'){
      heart(ctx, p.x, p.y, p.s * .55, p.rot, p.hue, Math.max(0, p.life));
    } else {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.hue;
      ctx.fillRect(-p.s * .4, -p.s * .18, p.s * .8, p.s * .36);
      ctx.restore();
    }
  }

  requestAnimationFrame(loop);
}
resize();
loop();

/* ══════════════ 背景音乐 ══════════════
   优先播放同目录的 CONFIG.bgmFile（例如 bgm.mp3）；
   文件不存在或加载失败时，自动回退到 Web Audio 实时合成的轻音乐。
   音乐按钮对两者都生效。
*/
const Music = (() => {
  const fileEl = document.getElementById('bgm');
  let actx = null, master = null, timer = null, on = false, step = 0;
  let mode = 'none';                 // 'none' | 'file' | 'synth'

  // 页面一打开就开始预加载歌曲，这样点「开始」时能立刻响。
  // 用 try 包住：万一预加载出问题，也不能连累后面的游戏和场景逻辑
  try {
    if (fileEl && CONFIG.bgmFile){
      fileEl.src = CONFIG.bgmFile;
      fileEl.load();
    }
  } catch (err){
    console.warn('背景音乐预加载失败（不影响页面）:', err);
  }

  /* ───────── 内置音乐：怀旧木吉他 ─────────
     用 Karplus-Strong 物理建模合成拨弦音色（噪声脉冲 + 延迟线 + 均值滤波）。
     注意：不能在 Web Audio 里直接搭延迟反馈回路——规范规定回路中的
     DelayNode 最小延迟为 128 采样，会导致 375Hz 以上的音全部走音。
     所以这里在 JS 里把拨弦波形渲染成 AudioBuffer，再按时间点播放。
     和声进行与分解和弦均为原创，不涉及任何现有歌曲的旋律。          */

  const TEMPO  = 62;                 // BPM，慢一点更有旧时光的感觉
  const EIGHTH = 60 / TEMPO / 2;     // 一个八分音符的秒数

  // 四小节循环：Cmaj7 → Am7 → Fmaj7 → G
  // bass 用真实吉他的低把位音（C3 / A2 / F2 / G2）
  const PROG = [
    { bass: 130.81, arp: [329.63, 392.00, 493.88, 659.25] }, // Cmaj7
    { bass: 110.00, arp: [329.63, 392.00, 523.25, 659.25] }, // Am7
    { bass:  87.31, arp: [349.23, 440.00, 523.25, 698.46] }, // Fmaj7
    { bass:  98.00, arp: [293.66, 392.00, 493.88, 587.33] }, // G
  ];
  const ARP = [0, 1, 2, 3, 2, 1, 2]; // 第 1 拍拨低音，其余 7 个八分音符的分解顺序

  let bus = null, nextStepTime = 0;
  const pluckCache = new Map();

  // 生成一段衰减噪声，当作房间混响的脉冲响应
  function makeIR(seconds, decay){
    const len = Math.floor(actx.sampleRate * seconds);
    const buf = actx.createBuffer(2, len, actx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  /* Karplus-Strong：把一根弦的振动渲染成一段音频波形（同样的音只渲染一次）
     用分数延迟 + 线性插值，保证音高精确；若用整数延迟，高音会偏低约 10 音分 */
  function renderPluck(freq, dur){
    const key = freq.toFixed(2) + '|' + dur.toFixed(2);
    if (pluckCache.has(key)) return pluckCache.get(key);

    const sr  = actx.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = actx.createBuffer(1, len, sr);
    const out = buf.getChannelData(0);

    // 延迟线长度 = 弦的振动周期。均值滤波会额外带来 0.5 个采样的延迟，所以要减掉
    const D    = Math.max(2, sr / freq - 0.5);
    const size = Math.ceil(D) + 2;
    const line = new Float32Array(size);
    for (let i = 0; i < size; i++) line[i] = Math.random() * 2 - 1;  // 拨片触弦的噪声激励

    const decay = 0.998;         // 每经过一个周期的衰减量（越大余音越长）
    let idx = 0, prev = 0, peak = 0;

    for (let i = 0; i < len; i++){
      // 读取 D 个采样之前的值，用线性插值实现分数延迟
      const rp = idx + size - D;
      const f0 = Math.floor(rp);
      const i0 = ((f0 % size) + size) % size;
      const i1 = (i0 + 1) % size;
      const fr = rp - f0;
      const delayed = line[i0] + (line[i1] - line[i0]) * fr;

      // 相邻两点取平均 → 高次谐波衰减更快，正是真实琴弦的听感
      line[idx] = 0.5 * (delayed + prev) * decay;
      prev = delayed;
      out[i] = delayed;

      const a = delayed < 0 ? -delayed : delayed;
      if (a > peak) peak = a;
      idx = (idx + 1) % size;
    }

    // 归一化 + 收尾淡出，避免缓冲结束时的爆音
    const norm = peak > 0 ? 0.9 / peak : 1;
    const fade = Math.min(len, Math.floor(sr * 0.15));
    for (let i = 0; i < len; i++){
      let v = out[i] * norm;
      if (i > len - fade) v *= (len - i) / fade;
      out[i] = v;
    }

    pluckCache.set(key, buf);
    return buf;
  }

  /* 拨一根弦 */
  function pluck(freq, time, dur, vol){
    const src = actx.createBufferSource();
    src.buffer = renderPluck(freq, dur);

    const g = actx.createGain();
    g.gain.value = vol;

    src.connect(g);
    g.connect(bus);
    src.start(time);

    setTimeout(() => { try { g.disconnect(); src.disconnect(); } catch (e){} },
      Math.max(0, (time - actx.currentTime + dur + 0.2) * 1000));
  }

  function scheduleStep(i, time){
    const bar = Math.floor(i / 8) % PROG.length;
    const pos = i % 8;
    const ch  = PROG[bar];

    // 轻微的时间与力度浮动，听起来像人在弹而不是机器在跑
    const t = time + (Math.random() - 0.5) * 0.014;

    if (pos === 0){                                  // 第 1 拍：低音弦 + 高音
      pluck(ch.bass,   t,        3.0, 0.30);
      pluck(ch.arp[0], t + 0.005, 2.4, 0.15);
    } else if (pos === 4){                           // 第 3 拍：低音弦再来一次
      pluck(ch.bass,   t,        2.6, 0.22);
      pluck(ch.arp[2], t + 0.005, 2.2, 0.14);
    } else {                                         // 其余八分音符：分解和弦
      pluck(ch.arp[ARP[(pos - 1) % ARP.length]], t, 2.2, 0.13 + Math.random() * 0.05);
    }

    // 每两小节收尾时透出一个高音，像泛音
    if (pos === 6 && bar % 2 === 1) pluck(ch.arp[3] * 2, t + 0.012, 2.8, 0.07);
  }

  // 提前 0.4 秒排程，避免 setInterval 抖动导致节奏不稳
  function scheduler(){
    if (!actx) return;
    while (nextStepTime < actx.currentTime + 0.4){
      scheduleStep(step, nextStepTime);
      nextStepTime += EIGHTH;
      step++;
    }
  }

  function synthStart(){
    try{
      if (!actx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        actx = new AC();

        bus = actx.createBiquadFilter();      // 柔化高频，木头味更足
        bus.type = 'lowpass';
        bus.frequency.value = 5200;
        bus.Q.value = 0.4;

        const dry  = actx.createGain(); dry.gain.value = 0.85;
        const conv = actx.createConvolver();
        conv.buffer = makeIR(2.4, 2.6);       // 房间混响
        const wet  = actx.createGain(); wet.gain.value = 0.30;

        master = actx.createGain();
        master.gain.value = 0.0;

        const comp = actx.createDynamicsCompressor();  // 防止叠加削波
        comp.threshold.value = -14;
        comp.knee.value = 14;
        comp.ratio.value = 4;
        comp.attack.value = 0.005;
        comp.release.value = 0.25;

        bus.connect(dry);  dry.connect(master);
        bus.connect(conv); conv.connect(wet); wet.connect(master);
        master.connect(comp); comp.connect(actx.destination);
      }

      if (actx.state === 'suspended') actx.resume();
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setValueAtTime(master.gain.value, actx.currentTime);
      master.gain.linearRampToValueAtTime(0.85, actx.currentTime + 2.0);

      if (!timer){
        nextStepTime = actx.currentTime + 0.12;
        timer = setInterval(scheduler, 90);
      }
      return true;
    } catch (err){
      console.warn('内置音乐启动失败（不影响使用）:', err);
      return false;
    }
  }

  function synthStop(){
    if (!actx) return;
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(master.gain.value, actx.currentTime);
    master.gain.linearRampToValueAtTime(0.0, actx.currentTime + 0.6);
    clearInterval(timer); timer = null;
  }

  /* ───────── 外部歌曲文件 ─────────
     这里的关键：必须在用户手势里「立刻」调用 play()，
     不能等文件加载完再放——等的过程会错过浏览器的手势窗口，
     而且慢网络下「等缓冲完」可能永远等不到，就白白放不出歌了。
     正确做法是：立刻 play()，让浏览器自己边下边播；
     同时用内置音乐兜底，等歌曲真的出声了再无缝切过去。 */
  function fadeTo(el, target, ms){
    const from = el.volume, t0 = performance.now();
    (function run(){
      const k = Math.min(1, (performance.now() - t0) / ms);
      el.volume = Math.max(0, Math.min(1, from + (target - from) * k));
      if (k < 1) requestAnimationFrame(run);
    })();
  }

  let fileStarted  = false;   // 歌曲是否真的开始出声
  let filePending  = false;   // 是否正在等歌曲出声
  let stopgapTimer = null;    // 兜底计时器

  /* 立刻发起播放，不等待任何加载状态 */
  function tryPlayFile(){
    if (!fileEl || !CONFIG.bgmFile || filePending) return Promise.resolve(false);
    filePending = true;
    fileEl.volume = 0;
    let p;
    try { p = fileEl.play(); }
    catch (err){ filePending = false; console.warn('歌曲播放异常:', err); return Promise.resolve(false); }

    const done = (ok) => { filePending = false; return ok; };
    if (p && typeof p.then === 'function') return p.then(() => done(true)).catch(() => done(false));
    // 老浏览器 play() 不返回 Promise
    filePending = false;
    return Promise.resolve(true);
  }

  /* 切到歌曲：内置音乐淡出，歌曲淡入 */
  function switchToFile(){
    const wasSynth = (mode === 'synth');
    if (wasSynth) synthStop();
    if (stopgapTimer){ clearTimeout(stopgapTimer); stopgapTimer = null; }
    mode = 'file';
    on = true;
    fadeTo(fileEl, CONFIG.bgmVolume, wasSynth ? 1500 : 1100);
    console.log('♪ 背景音乐：' + CONFIG.bgmFile);
  }

  /* 先用内置音乐垫着（歌曲一旦就绪会自动切过去） */
  function fallbackToSynth(){
    if (stopgapTimer){ clearTimeout(stopgapTimer); stopgapTimer = null; }
    if (mode === 'synth'){ if (!on) on = synthStart(); return on; }
    if (mode === 'file') return on;          // 歌曲正在放，不用兜底
    mode = 'synth';
    on = synthStart();
    console.log(on ? '♪ 背景音乐：歌曲还没就绪，先用内置合成音乐垫着'
                  : '♪ 背景音乐：播放失败（不影响页面使用）');
    return on;
  }

  if (fileEl){
    /* 歌曲真的开始出声了 —— 如果这时在放内置音乐，就无缝换掉 */
    fileEl.addEventListener('playing', () => {
      fileStarted = true;
      filePending = false;
      if (stopgapTimer){ clearTimeout(stopgapTimer); stopgapTimer = null; }
      if (mode !== 'file') switchToFile();
      else { on = true; fadeTo(fileEl, CONFIG.bgmVolume, 900); }
    });

    /* 文件真的坏了（找不到 / 格式不支持）才彻底放弃 */
    fileEl.addEventListener('error', () => {
      fileStarted = false;
      filePending = false;
      if (!CONFIG.bgmFile) return;
      console.warn('♪ 歌曲文件无法播放，改用内置音乐');
      if (mode !== 'file') fallbackToSynth();
    });

    /* 兜底：万一首次自动播放被浏览器拦下，之后用户任何一次点击都再试一次 */
    const retryFile = () => {
      if (mode === 'synth' && !fileStarted && !filePending && CONFIG.bgmFile) {
        tryPlayFile().then(ok => { if (ok) switchToFile(); });
      }
    };
    document.addEventListener('pointerdown', retryFile, true);
    document.addEventListener('touchstart',  retryFile, true);
    document.addEventListener('keydown',     retryFile, true);
  }

  /* 注意：start() 会在点击事件里被同步调用，
     所以第一句就发起 play()，中间不能有任何 await，
     否则会脱离浏览器的用户手势窗口，iOS / 微信里就会播放失败。 */
  function start(){
    // 已经确定在用歌曲 → 直接续播
    if (mode === 'file' && fileEl){
      fileEl.volume = 0;
      let p;
      try { p = fileEl.play(); } catch (err){ p = null; }
      if (p && typeof p.then === 'function'){
        return p.then(() => { fileEl.volume = CONFIG.bgmVolume; on = true; return true; })
                .catch(() => { fallbackToSynth(); return on; });
      }
      fileEl.volume = CONFIG.bgmVolume; on = true;
      return Promise.resolve(true);
    }

    // 之前在用内置音乐 → 续播，同时顺便再试一次歌曲
    if (mode === 'synth'){
      on = synthStart();
      if (!fileStarted) tryPlayFile().then(ok => { if (ok) switchToFile(); });
      return Promise.resolve(on);
    }

    /* ── 首次播放 ── */
    const attempt = tryPlayFile();

    // 兜底：2.6 秒还没出声就先用内置音乐垫着（歌曲一旦出声会自动切过去）
    stopgapTimer = setTimeout(() => {
      stopgapTimer = null;
      if (!fileStarted) fallbackToSynth();
    }, 2600);

    attempt.then(ok => {
      if (stopgapTimer){ clearTimeout(stopgapTimer); stopgapTimer = null; }
      if (ok) switchToFile();
      else if (!fileStarted) fallbackToSynth();
    });

    return attempt;
  }

  function stop(){
    if (fileEl){
      fadeTo(fileEl, 0, 400);
      setTimeout(() => { try { fileEl.pause(); } catch (e){} }, 430);
    }
    if (mode === 'synth') synthStop();
    on = false;
  }

  function stop(){
    if (mode === 'file' && fileEl){
      fadeTo(fileEl, 0, 400);
      setTimeout(() => { try { fileEl.pause(); } catch (e){} }, 430);
    }
    if (mode === 'synth') synthStop();
    on = false;
  }

  return {
    async toggle(){ if (on){ stop(); return false; } return await start(); },
    start(){ return start(); },
    isOn(){ return on; },
    mode(){ return mode; }
  };
})();

/* ══════════════ 打字机 ══════════════ */
async function typeInto(el, text, speed){
  for (let i = 0; i < text.length; i++){
    el.textContent = text.slice(0, i + 1);
    // 标点处稍微停顿，读起来更有呼吸感
    const ch = text[i];
    let d = speed;
    if ('，、'.includes(ch)) d = speed * 5;
    if ('。！？…'.includes(ch)) d = speed * 9;
    await wait(d);
  }
}

/* ══════════════ 小游戏：三个不同类型的关卡 ══════════════
   页面一打开就是这里，看起来就是个普通的休闲小游戏。
   三关全部玩完之后，才会突然反转成表白。 */
const Games = (() => {
  const mask      = document.getElementById('gameMask');
  const maskTitle = document.getElementById('maskTitle');
  const maskText  = document.getElementById('maskText');
  const maskBtn   = document.getElementById('maskBtn');
  const hudStage  = document.getElementById('hudStage');
  const hudScore  = document.getElementById('hudScore');
  const hudTime   = document.getElementById('hudTime');
  const hudALabel = document.getElementById('hudALabel');
  const hudBLabel = document.getElementById('hudBLabel');
  const hudBUnit  = document.getElementById('hudBUnit');
  const gameTip   = document.getElementById('gameTip');
  const paneCatch = document.getElementById('catchStage');
  const paneMole  = document.getElementById('moleStage');
  const paneMem   = document.getElementById('memStage');
  const flash     = document.getElementById('glitchFlash');

  let index = -1;             // 当前第几关（0 起）
  let musicStarted = false;   // 音乐只在第一次点击时启动
  let phase = 'play';         // 'play' = 正在闯关，"victory" = 通关结算中
  const stageScores = [];     // 每关的最终成绩，通关结算时展示
  let confettiTimer = null;   // 通关彩带的循环计时器

  /* ── 通用界面 ── */
  function showMask(title, html, btn){
    maskTitle.innerHTML = title;
    maskText.innerHTML  = html;
    if (btn){ maskBtn.textContent = btn; maskBtn.style.display = ''; }
    else    { maskBtn.style.display = 'none'; }
    mask.classList.add('show');
  }
  const hideMask = () => mask.classList.remove('show');
  function only(name){
    paneCatch.classList.toggle('on', name === 'catch');
    paneMole .classList.toggle('on', name === 'mole');
    paneMem  .classList.toggle('on', name === 'memory');
  }
  function setHud(no, total, scoreText, timeText){
    hudStage.textContent = '第 ' + no + ' / ' + total + ' 关';
    hudScore.textContent = scoreText;
    hudTime.textContent  = timeText;
    // 顺手记下每关的最终成绩（形如 "12 / 15"），结算界面要用
    const m = /^(\d+)/.exec(scoreText);
    if (m) stageScores[no - 1] = +m[1];
  }

  /* ─────────────────────────────────────────────
     第 1 关：接住掉下来的东西（星星 / 宝石 / 炸弹）
     ───────────────────────────────────────────── */
  const CatchStage = (() => {
    const cv = document.getElementById('gameCanvas');
    const g  = cv.getContext('2d');
    const CFG = CONFIG.games.catch;
    const BASKET_TOP = 30;
    const keys = new Set();

    let W = 0, H = 0, DPR = 1;
    let basketW = 84, basketX = 0, targetX = 0;
    let items = [], sparks = [];
    let score = 0, timeLeft = 0, clock = 0;
    let spawnTimer = 0, spawnGap = 720;
    let raf = null, last = 0, running = false;

    const clampX = (x) => Math.min(Math.max(x, basketW / 2), Math.max(basketW / 2, W - basketW / 2));
    const basketY = () => H - BASKET_TOP;

    function resize(){
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth || 320;
      H = cv.clientHeight || 240;
      cv.width  = Math.max(1, Math.floor(W * DPR));
      cv.height = Math.max(1, Math.floor(H * DPR));
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      basketW = Math.max(62, Math.min(100, W * 0.22));
      if (!basketX) basketX = W / 2;
      basketX = clampX(basketX);
      targetX = basketX;
    }
    window.addEventListener('resize', () => { if (running) resize(); });

    function spawn(){
      const r = Math.random();
      let kind = 'star';
      if (CFG.bombs && clock > 3.5 && r < 0.24) kind = 'bomb';
      else if (r > 0.87)                        kind = 'gem';
      items.push({
        x: 24 + Math.random() * Math.max(1, W - 48),
        y: -26,
        vy: 92 + Math.random() * 58 + clock * 4,
        vx: (Math.random() - .5) * 40,
        size: kind === 'gem' ? 12 : 10.5,
        rot: (Math.random() - .5) * .6,
        vr: (Math.random() - .5) * 1.2,
        kind: kind
      });
    }

    function addSparks(x, y, color, n){
      for (let i = 0; i < n; i++){
        const a = Math.random() * Math.PI * 2, s = Math.random() * 130 + 40;
        sparks.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
                      life: 1, color: color, r: Math.random() * 2.4 + 1.2 });
      }
    }

    function starPath(cx, cy, r, rot){
      g.beginPath();
      for (let i = 0; i < 10; i++){
        const rr = (i % 2) ? r * .44 : r;
        const a = rot - Math.PI / 2 + i * Math.PI / 5;
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        if (i) g.lineTo(x, y); else g.moveTo(x, y);
      }
      g.closePath();
    }
    function gemPath(cx, cy, r, rot){
      g.save(); g.translate(cx, cy); g.rotate(rot);
      g.beginPath();
      g.moveTo(0, -r);
      g.lineTo(r * .84, -r * .16);
      g.lineTo(0, r);
      g.lineTo(-r * .84, -r * .16);
      g.closePath();
      g.restore();
    }

    function drawItem(it){
      if (it.kind === 'bomb'){
        g.save();
        g.fillStyle = '#333856';
        g.beginPath(); g.arc(it.x, it.y, it.size, 0, Math.PI * 2); g.fill();
        g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 1.2; g.stroke();
        g.beginPath();
        g.moveTo(it.x + it.size * .5, it.y - it.size * .7);
        g.quadraticCurveTo(it.x + it.size * 1.35, it.y - it.size * 1.5,
                           it.x + it.size * .55, it.y - it.size * 1.95);
        g.strokeStyle = '#ffb454'; g.lineWidth = 2; g.stroke();
        g.beginPath(); g.arc(it.x + it.size * .55, it.y - it.size * 2.1, 2.2, 0, Math.PI * 2);
        g.fillStyle = '#ffd166'; g.fill();
        g.restore();
        return;
      }
      if (it.kind === 'gem'){
        g.save();
        g.globalAlpha = .28; g.fillStyle = '#63e6ff';
        g.beginPath(); g.arc(it.x, it.y, it.size * 2, 0, Math.PI * 2); g.fill();
        g.restore();
        gemPath(it.x, it.y, it.size, it.rot);
        g.fillStyle = '#7fe9ff'; g.fill();
        g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.1; g.stroke();
        return;
      }
      g.save();
      g.globalAlpha = .3; g.fillStyle = '#ffd166';
      g.beginPath(); g.arc(it.x, it.y, it.size * 1.9, 0, Math.PI * 2); g.fill();
      g.restore();
      starPath(it.x, it.y, it.size, it.rot);
      g.fillStyle = '#ffd75e'; g.fill();
      g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1.1; g.stroke();
    }

    function drawBasket(){
      const y = basketY(), x = basketX - basketW / 2, h = 16;
      g.save();
      g.shadowColor = 'rgba(255,79,139,.7)'; g.shadowBlur = 16;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + basketW, y);
      g.lineTo(x + basketW * .84, y + h);
      g.quadraticCurveTo(x + basketW / 2, y + h + 7, x + basketW * .16, y + h);
      g.closePath();
      const grd = g.createLinearGradient(0, y, 0, y + h);
      grd.addColorStop(0, 'rgba(255,255,255,.34)');
      grd.addColorStop(1, 'rgba(255,107,157,.55)');
      g.fillStyle = grd; g.fill();
      g.strokeStyle = 'rgba(255,220,235,.75)'; g.lineWidth = 1.4; g.stroke();
      g.restore();
    }

    const updateHud = () => setHud(1, 3, score + ' / ' + CFG.goal, Math.max(0, Math.ceil(timeLeft)));

    function finish(){
      running = false;
      cancelAnimationFrame(raf);
      onStageEnd(score);
    }

    function frame(now){
      if (!running) return;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      clock += dt; timeLeft -= dt;

      if (keys.has('ArrowLeft'))  targetX = clampX(targetX - 480 * dt);
      if (keys.has('ArrowRight')) targetX = clampX(targetX + 480 * dt);
      basketX += (targetX - basketX) * (1 - Math.pow(.0015, dt));

      spawnTimer -= dt * 1000;
      if (spawnTimer <= 0){
        spawn();
        spawnGap = Math.max(360, 720 - clock * 9);
        spawnTimer = spawnGap;
      }

      const by = basketY();
      for (let i = items.length - 1; i >= 0; i--){
        const it = items[i];
        it.vy += 55 * dt;
        it.y  += it.vy * dt;
        it.x  += it.vx * dt;
        it.rot += it.vr * dt;
        if (it.x < 14 || it.x > W - 14) it.vx *= -1;

        // 进筐判定
        if (it.y + it.size > by - 2 && it.y < by + 22 &&
            Math.abs(it.x - basketX) < basketW * .5){
          if (it.kind === 'bomb'){
            score = Math.max(0, score - 1);
            addSparks(it.x, it.y, '#8b93b8', 16);
          } else if (it.kind === 'gem'){
            score += 3; addSparks(it.x, it.y, '#7fe9ff', 22);
          } else {
            score += 1; addSparks(it.x, it.y, '#ffd75e', 16);
          }
          items.splice(i, 1);
          continue;
        }
        if (it.y > H + 34) items.splice(i, 1);
      }

      for (let i = sparks.length - 1; i >= 0; i--){
        const s = sparks[i];
        s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 240 * dt;
        s.life -= dt * 2.1;
        if (s.life <= 0) sparks.splice(i, 1);
      }

      updateHud();

      g.clearRect(0, 0, W, H);
      for (const it of items) drawItem(it);
      for (const s of sparks){
        g.globalAlpha = Math.max(0, s.life);
        g.fillStyle = s.color;
        g.beginPath(); g.arc(s.x, s.y, s.r * s.life + .6, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
      drawBasket();

      if (score >= CFG.goal || timeLeft <= 0) return finish();
      raf = requestAnimationFrame(frame);
    }

    cv.addEventListener('pointermove', (e) => {
      const r = cv.getBoundingClientRect();
      targetX = clampX(e.clientX - r.left);
    });
    cv.addEventListener('pointerdown', (e) => {
      if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
      const r = cv.getBoundingClientRect();
      targetX = clampX(e.clientX - r.left);
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
        keys.add(e.key);
        if (running) e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => keys.delete(e.key));

    return {
      reset(){
        items = []; sparks = [];
        score = 0; clock = 0; timeLeft = CFG.time;
        spawnTimer = 260; spawnGap = 720;
        basketX = 0; resize(); basketX = targetX = W / 2;
        updateHud();
      },
      start(){
        resize(); running = true;
        cancelAnimationFrame(raf);
        last = performance.now();
        raf = requestAnimationFrame(frame);
      },
      stop(){ running = false; cancelAnimationFrame(raf); }
    };
  })();

  /* ─────────────────────────────────────────────
     第 2 关：打地鼠
     ───────────────────────────────────────────── */
  const MoleStage = (() => {
    const grid = document.getElementById('moleGrid');
    const CFG = CONFIG.games.mole;
    const HOLES = 9, UP_TIME = 0.95, GAP = 0.72;

    let holes = [], score = 0, timeLeft = 0, clock = 0;
    let upIndex = -1, upUntil = 0, nextPop = 0;
    let raf = null, last = 0, running = false;

    for (let i = 0; i < HOLES; i++){
      const h = document.createElement('div');
      h.className = 'hole';
      const m = document.createElement('span');
      m.className = 'mole';
      m.textContent = '🐹';
      h.appendChild(m);
      grid.appendChild(h);
      holes.push(h);
    }

    const setHole = (i, up) => holes[i].classList.toggle('up', up);
    const updateHud = () => setHud(2, 3, score + ' / ' + CFG.goal, Math.max(0, Math.ceil(timeLeft)));

    function pick(){
      let i = upIndex;
      while (i === upIndex && HOLES > 1) i = Math.floor(Math.random() * HOLES);
      return i;
    }

    grid.addEventListener('click', (e) => {
      if (!running) return;
      const h = e.target && e.target.closest ? e.target.closest('.hole') : null;
      if (!h) return;
      const i = holes.indexOf(h);
      if (i < 0 || i !== upIndex) return;
      score++;
      setHole(i, false);
      upIndex = -1;
      h.classList.add('hit');
      setTimeout(() => h.classList.remove('hit'), 170);
      nextPop = clock + 0.42;
      updateHud();
    });

    function finish(){
      running = false;
      if (upIndex >= 0){ setHole(upIndex, false); upIndex = -1; }
      cancelAnimationFrame(raf);
      onStageEnd(score);
    }

    function frame(now){
      if (!running) return;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      clock += dt; timeLeft -= dt;

      if (upIndex >= 0 && clock >= upUntil){ setHole(upIndex, false); upIndex = -1; }
      if (upIndex < 0 && clock >= nextPop){
        upIndex = pick();
        setHole(upIndex, true);
        upUntil = clock + UP_TIME;
        nextPop = clock + GAP;
      }

      updateHud();
      if (score >= CFG.goal || timeLeft <= 0) return finish();
      raf = requestAnimationFrame(frame);
    }

    return {
      reset(){
        for (let i = 0; i < holes.length; i++){
          holes[i].classList.remove('up');
          holes[i].classList.remove('hit');
        }
        upIndex = -1; score = 0; clock = 0; timeLeft = CFG.time; nextPop = 0.45;
        updateHud();
      },
      start(){
        running = true;
        cancelAnimationFrame(raf);
        last = performance.now();
        raf = requestAnimationFrame(frame);
      },
      stop(){
        running = false;
        if (upIndex >= 0){ setHole(upIndex, false); upIndex = -1; }
        cancelAnimationFrame(raf);
      }
    };
  })();

  /* ─────────────────────────────────────────────
     第 3 关：翻牌配对（配完这一刻就是反转点）
     ───────────────────────────────────────────── */
  const MemoryStage = (() => {
    const grid = document.getElementById('memGrid');
    const CFG = CONFIG.games.memory;
    const SYMBOLS = ['★', '◆', '●', '▲', '✦', '❖'];

    let cards = [];
    let first = null, lock = false, matched = 0;
    let timeLeft = 0, raf = null, last = 0, running = false;

    const updateHud = () => setHud(3, 3, matched + ' / ' + CFG.pairs, Math.max(0, Math.ceil(timeLeft)));

    function build(){
      grid.innerHTML = '';
      cards = [];
      const syms = SYMBOLS.slice(0, CFG.pairs);
      const faces = syms.concat(syms);
      for (let i = faces.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        const t = faces[i]; faces[i] = faces[j]; faces[j] = t;
      }
      for (let k = 0; k < faces.length; k++){
        const c = document.createElement('div');
        c.className = 'card3d';
        const inner = document.createElement('div');
        inner.className = 'cardInner';
        const back = document.createElement('div');
        back.className = 'cardFace cardBack';
        back.textContent = '?';
        const front = document.createElement('div');
        front.className = 'cardFace cardFront';
        front.textContent = faces[k];
        inner.appendChild(back);
        inner.appendChild(front);
        c.appendChild(inner);
        c.dataset.sym = faces[k];
        grid.appendChild(c);
        cards.push(c);
      }
    }

    grid.addEventListener('click', (e) => {
      if (!running || lock) return;
      const c = e.target && e.target.closest ? e.target.closest('.card3d') : null;
      if (!c || c.classList.contains('flip') || c.classList.contains('matched')) return;

      c.classList.add('flip');
      if (!first){ first = c; return; }

      const a = first, b = c;
      first = null;
      if (a.dataset.sym === b.dataset.sym){
        a.classList.add('matched');
        b.classList.add('matched');
        matched++;
        updateHud();
        if (matched >= CFG.pairs) setTimeout(finish, 560);
      } else {
        lock = true;
        setTimeout(() => {
          a.classList.remove('flip');
          b.classList.remove('flip');
          lock = false;
        }, 720);
      }
    });

    function finish(){
      if (!running) return;
      running = false;
      cancelAnimationFrame(raf);
      onStageEnd(matched);
    }

    function frame(now){
      if (!running) return;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      timeLeft -= dt;
      updateHud();
      if (timeLeft <= 0) return finish();
      raf = requestAnimationFrame(frame);
    }

    return {
      reset(){
        build();
        first = null; lock = false; matched = 0;
        timeLeft = CFG.time;
        updateHud();
      },
      start(){
        running = true;
        cancelAnimationFrame(raf);
        last = performance.now();
        raf = requestAnimationFrame(frame);
      },
      stop(){ running = false; cancelAnimationFrame(raf); },
      /* 反转：所有牌依次翻成爱心 */
      revealHearts(){
        for (let i = 0; i < cards.length; i++){
          (function (c, k){
            setTimeout(() => {
              c.classList.add('flip', 'matched', 'reveal');
              const f = c.querySelector('.cardFront');
              if (f) f.textContent = '♥';
            }, k * 65);
          })(cards[i], i);
        }
      }
    };
  })();

  /* ─────────────────────────────────────────────
     关卡调度
     ───────────────────────────────────────────── */
  const STAGES = [
    { pane: 'catch',  api: CatchStage,  name: '接住掉下来的东西',
      aLabel: '★', bLabel: '⏱', bUnit: 's',
      tip: '移动鼠标 / 手指，或按 ← → 键控制篮子。<br>接住 <b>★</b> 得 1 分、<b>◆</b> 得 3 分，躲开 <b>炸弹</b>。' },
    { pane: 'mole',   api: MoleStage,   name: '打地鼠',
      aLabel: '🐹', bLabel: '⏱', bUnit: 's',
      tip: '地鼠冒头的瞬间点它。<br>点中一只得 1 分。' },
    { pane: 'memory', api: MemoryStage, name: '翻牌配对',
      aLabel: '配对', bLabel: '⏱', bUnit: 's',
      tip: '翻开两张一样的牌就能消掉。<br>全部配完就通关。' }
  ];
  const TOTAL = STAGES.length;

  function showStage(i){
    index = i;
    const st = STAGES[i];
    only(st.pane);                       // 先切面板，canvas 才有正确的尺寸
    hudALabel.textContent = st.aLabel;
    hudBLabel.textContent = st.bLabel;
    hudBUnit.textContent  = st.bUnit;
    gameTip.textContent = '第 ' + (i + 1) + ' 关 · ' + st.name;
    st.api.reset();
    showMask('第 ' + (i + 1) + ' 关 · ' + st.name, st.tip, '开始');
  }

  function beginStage(){
    hideMask();
    STAGES[index].api.start();
  }

  /* 每关结束（达成目标 或 时间到）都会走到这里，不会卡住 */
  function onStageEnd(){
    STAGES[index].api.stop();
    if (index < TOTAL - 1){
      showMask('第 ' + (index + 1) + ' 关 完成 ✓', '继续下一关…', null);
      setTimeout(() => showStage(index + 1), 1050);
    } else {
      victory();
    }
  }

  /* ─────────────────────────────────────────────
     三关全部通过 → 「恭喜通关」结算画面
     ─────────────────────────────────────────────
     这一步是刻意的：先给她一个再正常不过的游戏通关结算，
     让她彻底放松下来、以为事情就到此为止了。
     画面里一个粉色爱心都没有，就是游戏该有的金色彩带。
     真正的转折留到她自己点「领取奖励」的那一刻。 */
  function victory(){
    phase = 'victory';

    // 撒一波中性彩带（只有金白青绿，全部是纸片，没有爱心）
    for (let i = 0; i < 5; i++){
      setTimeout(() => {
        burst(W * (.12 + Math.random() * .76), H * (.14 + Math.random() * .38), 46, GAME_PAL, 'confetti');
      }, i * 180);
    }
    // 之后继续零星撒，保持热闹
    let n = 0;
    confettiTimer = setInterval(() => {
      burst(W * (.08 + Math.random() * .84), H * (.1 + Math.random() * .34), 24, GAME_PAL, 'confetti');
      if (++n > 20){ clearInterval(confettiTimer); confettiTimer = null; }
    }, 430);

    const sc = (i, unit) => {
      const v = stageScores[i];
      return '<span class="vRow"><i>' + ['接星星','打地鼠','翻　牌'][i] + '</i><b>' +
             (v === undefined ? '—' : v) + '</b>' + unit + '</span>';
    };

    showMask(
      '🎉 恭喜通关！',
      '<span class="vSub">三 关 全 部 通 过</span>' +
      sc(0, ' 分') + sc(1, ' 只') + sc(2, ' 对'),
      '领取奖励 →'
    );
    mask.classList.add('victory');
  }

  function stopCelebration(){
    if (confettiTimer){ clearInterval(confettiTimer); confettiTimer = null; }
  }

  /* ── 反转：她自己点下「领取奖励」之后，才翻出表白 ── */
  function reveal(){
    stopCelebration();
    mask.classList.remove('victory');
    hideMask();

    // 先让"游戏"再停留一下下——她还以为这是个游戏，
    // 然后下一帧整个桌面翻成爱心。这一拍是整个惊喜的支点。
    setTimeout(() => {
      // 1. 桌上所有的牌一起变成爱心
      MemoryStage.revealHearts();

      // 1b. 背景上飘着的小星星也全部变成爱心（整片画面的气质一起翻过来）
      ambientToHearts();

      // 2. 满屏粉光闪一下
      flash.classList.remove('on');
      void flash.offsetWidth;      // 强制重排，让动画能重复播放
      flash.classList.add('on');

      // 3. 背景连放几波爱心（这次才是粉色的）
      for (let i = 0; i < 5; i++){
        setTimeout(() => {
          burst(W * (.15 + Math.random() * .7), H * (.18 + Math.random() * .44), 62);
        }, 220 + i * 190);
      }
    }, 260);

    // 4. 进入情书
    setTimeout(() => {
      flash.classList.remove('on');
      mask.classList.remove('show');
      // 微信浏览器顶部会显示页面标题，反转的这一刻让它跟着变
      try { document.title = '给你的一封信 💌'; } catch (e){}
      go('sceneLetter');
      playLetter();
    }, 2100);
  }

  /* 按钮：闯关时是「开始 / 下一关」，通关结算时是「领取奖励」 */
  maskBtn.addEventListener('click', () => {
    if (!musicStarted){
      musicStarted = true;
      startMusic();
    }
    if (phase === 'victory'){
      phase = 'play';
      reveal();
    } else {
      beginStage();
    }
  });

  /* 页面入口 */
  function begin(){
    go('sceneGame');
    showStage(0);
  }

  return {
    begin: begin,
    /* 重新玩一遍 */
    restart(){
      CatchStage.stop(); MoleStage.stop(); MemoryStage.stop();
      stopCelebration();
      index = -1;
      phase = 'play';
      stageScores.length = 0;
      mask.classList.remove('victory');
      // 背景粒子也回到中性状态，重新玩一遍时惊喜依然有效
      loveAmbient = false;
      ambient.length = 0;
      musicStarted = true;      // 音乐已经在放了，不用再启动一次
      begin();
    }
  };
})();

/* ══════════════ 流程控制 ══════════════ */
const toAskBtn  = document.getElementById('toAskBtn');
const letterBox = document.getElementById('letterBox');

document.getElementById('askText').textContent = CONFIG.question;
document.getElementById('finalTitle').textContent = CONFIG.finalTitle;

/* 启动背景音乐：必须在用户的手势里同步发起，否则浏览器会拒绝播放。
   整个流程只调用一次（在小游戏第一次点「开始」的时候）。 */
function setMusicIcon(playing){
  musicBtn.textContent = playing ? '🎵' : '🔇';
  musicBtn.classList.toggle('paused', !playing);
}

/* 慢网络下歌曲可能几秒后才真正出声（先用内置音乐垫着），
   所以图标不能只看 start() 的返回值，要跟着实际状态走。 */
function watchMusicIcon(){
  let ticks = 0;
  const iv = setInterval(() => {
    if (Music.isOn()){ setMusicIcon(true); clearInterval(iv); }
    else if (++ticks > 40) clearInterval(iv);   // 最多盯 20 秒
  }, 500);
}

function startMusic(){
  try {
    const p = Music.start();
    if (p && typeof p.then === 'function') p.then(setMusicIcon).catch(() => {});
  } catch (err){
    console.warn('音乐启动异常（不影响页面）:', err);
  }
  watchMusicIcon();
}

async function playLetter(){
  go('sceneLetter');
  letterBox.innerHTML = '';
  await wait(500);

  for (const raw of LETTER_LINES){
    const text = T(raw);
    const p = document.createElement('p');
    p.className = 'line';
    const span = document.createElement('span');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    p.appendChild(span);
    p.appendChild(cursor);
    letterBox.appendChild(p);

    await wait(120);
    await typeInto(span, text, 62);
    await wait(380);
    cursor.remove();
    letterBox.scrollTop = letterBox.scrollHeight;
  }

  await wait(400);
  toAskBtn.style.display = 'inline-flex';
}

toAskBtn.addEventListener('click', () => {
  go('sceneAsk');
});

/* ── 「再想想」按钮：会逃跑，会变小，会说软话 ── */
const noBtn  = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
let dodge = 0;

function dodgeNo(){
  dodge++;
  const text = CONFIG.noTexts[Math.min(dodge, CONFIG.noTexts.length - 1)];
  noBtn.textContent = text;

  // 长大后先转为固定定位，才能在整屏乱跑
  if (!noBtn.classList.contains('fixed')){
    const r = noBtn.getBoundingClientRect();
    noBtn.style.width = r.width + 'px';
    noBtn.style.height = r.height + 'px';
    noBtn.classList.add('fixed');
  }

  const pad = 14;
  const w = noBtn.offsetWidth || 110;
  const h = noBtn.offsetHeight || 46;
  const maxX = Math.max(pad, window.innerWidth  - w - pad);
  const maxY = Math.max(pad, window.innerHeight - h - pad);
  const x = pad + Math.random() * (maxX - pad);
  const y = pad + Math.random() * (maxY - pad);

  const scale = Math.max(0.42, 1 - dodge * 0.11);
  noBtn.style.left = x + 'px';
  noBtn.style.top  = y + 'px';
  noBtn.style.transform = 'scale(' + scale + ') rotate(' + (Math.random()*20-10).toFixed(1) + 'deg)';

  // 「愿意」越来越大，越来越闪
  yesBtn.style.transform = 'scale(' + Math.min(1.5, 1 + dodge * 0.09) + ')';
  yesBtn.style.fontSize  = Math.min(23, 17 + dodge * 0.9) + 'px';
  yesBtn.style.padding   = (15 + dodge * 1.2) + 'px ' + (40 + dodge * 2) + 'px';

  // 最后彻底跑不动了
  if (dodge >= 6){
    noBtn.style.pointerEvents = 'none';
    noBtn.style.opacity = '0';
    noBtn.textContent = '好吧，你赢了';
  }
}

['mouseenter', 'touchstart', 'click'].forEach(ev => {
  noBtn.addEventListener(ev, (e) => {
    e.preventDefault();
    if (dodge >= 6) return;
    dodgeNo();
  }, { passive: false });
});

/* ── 「愿意」：结局 + 满屏爱心烟花 ── */
const finalText = document.getElementById('finalText');
const stampNames = document.getElementById('stampNames');
const stampDate = document.getElementById('stampDate');

function todayStr(){
  const d = new Date();
  return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
}

yesBtn.addEventListener('click', async () => {
  go('sceneFinal');

  finalText.innerHTML = T(CONFIG.finalText).split('\n').map(l => l || '&nbsp;').join('<br>');
  stampNames.textContent = CONFIG.from + '  ❤  ' + CONFIG.to;
  stampDate.textContent = '纪念日 · ' + todayStr();

  // 连续放几波烟花
  const waves = 6;
  for (let i = 0; i < waves; i++){
    setTimeout(() => {
      burst(
        W * (0.15 + Math.random() * 0.7),
        H * (0.18 + Math.random() * 0.45),
        70
      );
    }, i * 260);
  }
  // 之后再来一段持续的小烟花
  let extra = 0;
  const iv = setInterval(() => {
    burst(Math.random() * W, H * (0.15 + Math.random() * 0.5), 35);
    if (++extra > 6) clearInterval(iv);
  }, 900);
});

/* ── 重来 ── */
document.getElementById('replayBtn').addEventListener('click', () => {
  dodge = 0;
  noBtn.classList.remove('fixed');
  noBtn.style.cssText = '';
  noBtn.textContent = CONFIG.noTexts[0];
  yesBtn.style.cssText = '';
  bursts.length = 0;
  letterBox.innerHTML = '';
  toAskBtn.style.display = 'none';
  Games.restart();
});

/* ── 键盘彩蛋：空格推进当前这一步 ── */
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (document.getElementById('sceneGame').classList.contains('active')){
    const mb = document.getElementById('maskBtn');
    if (mb && mb.style.display !== 'none' && document.getElementById('gameMask').classList.contains('show')){
      mb.click();
    }
  } else if (document.getElementById('sceneLetter').classList.contains('active')){
    if (toAskBtn.style.display !== 'none') toAskBtn.click();
  }
});

/* ── 启动：页面一打开，直接就是小游戏 ── */
Games.begin();
</script>
