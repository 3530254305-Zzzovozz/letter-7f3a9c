<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>给你的一封信 💌</title>
<script>
/* 兜底诊断：脚本一旦报错就在页面底部显示出来，方便截图反馈。
   这里刻意用最老的 ES5 语法写，保证在旧浏览器里也能正常显示。
   一切正常时它永远不会出现。 */
(function () {
  function show(msg) {
    try {
      var bar = document.getElementById('__errbar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = '__errbar';
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;'
          + 'background:rgba(58,13,28,.97);color:#ffd6e8;'
          + 'font:11px/1.6 Consolas,monospace;padding:9px 12px;'
          + 'word-break:break-all;border-top:1px solid #ff6b9d';
        var host = document.body || document.documentElement;
        host.appendChild(bar);
      }
      bar.innerHTML += (bar.innerHTML ? '<br>' : '') + '⚠ ' + msg;
    } catch (e) {}
  }
  window.onerror = function (msg, url, line, col) {
    show(msg + '  @' + line + ':' + col);
    return false;
  };
  window.addEventListener('unhandledrejection', function (e) {
    show('异步错误: ' + ((e.reason && e.reason.message) || e.reason));
  });
})();
</script>
<!--
  ════════════════════════════════════════════════
   表白网页 · 使用说明
   1. 用记事本 / VS Code 打开本文件
   2. 找到下面的 CONFIG（大约在第 40 行）
      改掉 to / from / introLines / question 等内容
   3. 保存后双击打开即可（推荐 Chrome / Edge / Safari）
   4. 想加背景音乐：把 mp3 放在同目录，命名 bgm.mp3
  ════════════════════════════════════════════════
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root{
    --pink:#ff6b9d;
    --pink-soft:#ffa8c5;
    --rose:#ffd6e8;
    --deep:#150a26;
    --text:#fff3f8;
  }

  html,body{ height:100%; overflow:hidden; }

  body{
    background: radial-gradient(120% 90% at 50% 0%, #3a1c5c 0%, #241040 35%, #150a26 70%, #0b0514 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }

  #bg{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* 边缘暗角，让画面更有氛围 */
  .vignette{
    position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(75% 65% at 50% 45%, transparent 40%, rgba(6,2,14,.75) 100%);
  }

  /* ───────── 场景容器 ───────── */
  .scene{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    opacity:0; visibility:hidden;
    transform: scale(.96);
    transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1), visibility .7s;
    z-index:2;
  }
  .scene.active{ opacity:1; visibility:visible; transform:scale(1); }

  /* ───────── 玻璃卡片 ───────── */
  .card{
    width:min(560px, 100%);
    max-height: calc(100vh - 60px);
    overflow-y:auto;
    padding: 34px 28px 30px;
    border-radius: 26px;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
    border: 1px solid rgba(255,182,213,.28);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    text-align:center;
    scrollbar-width:none;
  }
  .card::-webkit-scrollbar{ display:none; }

  /* ───────── 开场 ───────── */
  .envelope{ font-size:62px; line-height:1; margin-bottom:18px; animation: float 3s ease-in-out infinite; }
  @keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-10px) } }

  h1{ font-size:clamp(22px,5.6vw,28px); font-weight:700; letter-spacing:.5px;
      background:linear-gradient(92deg,#fff 10%, var(--pink-soft) 45%, var(--pink) 90%);
      -webkit-background-clip:text; background-clip:text; color:transparent; }

  .sub{ margin-top:12px; font-size:14px; color:rgba(255,214,232,.62); letter-spacing:.5px; }

  /* ───────── 按钮 ───────── */
  .btn{
    margin-top:26px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding: 15px 40px;
    font-size:17px; font-weight:600; font-family:inherit;
    color:#fff; cursor:pointer; border:none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff7fae, #ff4f8b 55%, #e5306e);
    box-shadow: 0 12px 30px rgba(255,79,139,.45), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .25s cubic-bezier(.22,1.6,.4,1), box-shadow .25s, opacity .4s;
    position:relative;
  }
  .btn:hover{ transform: translateY(-3px) scale(1.04); box-shadow: 0 18px 40px rgba(255,79,139,.6); }
  .btn:active{ transform: scale(.96); }
  .btn.ghost{
    background: transparent; color: rgba(255,214,232,.85);
    border:1px solid rgba(255,182,213,.4); box-shadow:none;
    font-weight:500; font-size:15px; padding:13px 30px;
  }
  .btn.ghost:hover{ background: rgba(255,182,213,.12); box-shadow:none; transform:translateY(-2px); }

  /* ───────── 打字机情书 ───────── */
  #letterBox{ text-align:left; margin-top:6px; min-height: 190px; }
  #letterBox .line{
    font-size: clamp(15px, 4.2vw, 17px);
    line-height: 2;
    color: #ffeaf3;
    opacity:0; transform: translateY(10px);
    animation: rise .6s ease forwards;
    text-shadow: 0 2px 16px rgba(255,107,157,.28);
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0) } }

  .cursor{
    display:inline-block; width:2px; height:1em; margin-left:3px;
    background: var(--pink); vertical-align:-2px;
    animation: blink .85s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0 } }

  /* ───────── 表白场景 ───────── */
  .bigAsk{
    font-size: clamp(21px, 6vw, 27px); font-weight:700; line-height:1.65;
    background:linear-gradient(92deg,#fff, var(--pink-soft) 50%, var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .askEmoji{ font-size:52px; display:block; margin-bottom:14px; animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{ transform:scale(1) } 12%{ transform:scale(1.18) } 24%{ transform:scale(1) } 36%{ transform:scale(1.12) } }

  .btnRow{
    margin-top:30px; display:flex; gap:14px; justify-content:center;
    align-items:center; flex-wrap:wrap; min-height:60px;
  }
  #yesBtn{ transition: transform .35s cubic-bezier(.22,1.6,.4,1), font-size .35s, padding .35s; }
  #noBtn{
    transition: transform .18s ease-out, opacity .5s, font-size .35s;
    z-index:99; white-space:nowrap;
  }
  #noBtn.fixed{ position:fixed; margin:0; }

  /* ───────── 结局 ───────── */
  .finalTitle{
    font-size: clamp(24px, 7vw, 34px); font-weight:800; letter-spacing:1px;
    background:linear-gradient(92deg,#ffd6e8,#ff6b9d 55%,#ff2d6f);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .finalText{ margin-top:16px; font-size:clamp(14px,4vw,16px); line-height:2; color:rgba(255,235,243,.92); }
  .stamp{
    margin-top:24px; padding-top:18px;
    border-top:1px dashed rgba(255,182,213,.3);
    font-size:13px; color:rgba(255,214,232,.62); line-height:1.9; letter-spacing:.6px;
  }
  .stamp .names{ font-size:15px; color:#ffc2d9; font-weight:600; letter-spacing:1px; }

  /* ───────── 小游戏 ───────── */
  .gameHud{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:12px; font-size:13px; color:rgba(255,214,232,.8);
    letter-spacing:.5px;
  }
  .hudItem{ display:flex; align-items:center; gap:5px; }
  .hudItem b{ color:#ff9dc0; font-size:15px; }
  #lifeRow{ letter-spacing:2px; font-size:15px; }

  #gameWrap{
    position:relative; border-radius:18px; overflow:hidden;
    border:1px solid rgba(255,182,213,.22);
    background: radial-gradient(100% 80% at 50% 0%, rgba(255,107,157,.10), rgba(255,255,255,.015));
  }
  #gameCanvas{
    display:block; width:100%; height:min(46vh, 330px); min-height:220px;
    touch-action:none; cursor:none;
  }
  .gameMask{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:20px;
    text-align:center; background:rgba(16,7,30,.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity:0; visibility:hidden; transition:opacity .35s, visibility .35s;
  }
  .gameMask.show{ opacity:1; visibility:visible; }
  .gameMask h3{ font-size:19px; font-weight:700; color:#ffd6e8; }
  .gameMask p{ font-size:13.5px; line-height:1.9; color:rgba(255,214,232,.72); max-width:300px; }
  .gameTip{ margin-top:12px; font-size:12.5px; color:rgba(255,214,232,.45); line-height:1.8; }

  /* ───────── 音乐按钮 ───────── */
  #musicBtn{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); right:16px; z-index:50;
    width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,182,213,.35);
    background: rgba(255,255,255,.08); backdrop-filter: blur(10px);
    color:#ffd6e8; font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .25s, background .25s;
  }
  #musicBtn:hover{ transform: scale(1.1); background: rgba(255,255,255,.16); }
  #musicBtn.paused{ opacity:.5; }

  .hint{
    position:fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left:0; right:0;
    text-align:center; font-size:12px; color: rgba(255,214,232,.3);
    pointer-events:none; z-index:3; letter-spacing:.5px;
  }

  @media (max-width:420px){
    .card{ padding:28px 20px 24px; border-radius:22px; }
    .btnRow{ gap:10px; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="vignette"></div>

<!-- 背景音乐文件：把歌放到同目录命名 bgm.mp3 即可自动启用；没有该文件会自动回退到内置音乐 -->
<audio id="bgm" loop preload="auto" playsinline></audio>

<button id="musicBtn" class="paused" title="播放/暂停音乐">🔇</button>

<!-- ══════════ 场景 1：开场 ══════════ -->
<section class="scene active" id="sceneIntro">
  <div class="card">
    <div class="envelope">💌</div>
    <h1 id="introTitle">有一封信，只写给你</h1>
    <p class="sub">先玩一个小游戏，才能拆开这封信 🎮<br>BGM 会在这时候响起，记得开声音 🎧</p>
    <button class="btn" id="openBtn">开始</button>
  </div>
</section>

<!-- ══════════ 场景 2：小游戏 ══════════ -->
<section class="scene" id="sceneGame">
  <div class="card">
    <div class="gameHud">
      <div class="hudItem">🧺 已接住 <b id="hudScore">0</b> / <b id="hudGoal">12</b></div>
      <div class="hudItem" id="lifeRow">❤❤❤</div>
      <div class="hudItem">⏱ <b id="hudTime">30</b>s</div>
    </div>

    <div id="gameWrap">
      <canvas id="gameCanvas"></canvas>
      <div class="gameMask show" id="gameMask">
        <h3 id="maskTitle">帮我接住这些心 🧺</h3>
        <p id="maskText">移动鼠标 / 手指，或按 ← → 键来移动篮子。<br>接住 <b>爱心</b> 得分，别接 <b>碎裂的心</b> 哦。</p>
        <button class="btn" id="maskBtn">开始</button>
      </div>
    </div>

    <p class="gameTip">接满 <span id="tipGoal">12</span> 颗心，就解锁后面的信 ✉️</p>

</section>

<!-- ══════════ 场景 3：情书 ══════════ -->
<section class="scene" id="sceneLetter">
  <div class="card">
    <div id="letterBox"></div>
    <button class="btn" id="toAskBtn" style="display:none">还有一句话…</button>
  </div>
</section>

<!-- ══════════ 场景 4：表白 ══════════ -->
<section class="scene" id="sceneAsk">
  <div class="card">
    <span class="askEmoji">💗</span>
    <p class="bigAsk" id="askText">你愿意，做我的女朋友吗？</p>
    <div class="btnRow" id="btnRow">
      <button class="btn" id="yesBtn">愿意 ❤️</button>
      <button class="btn ghost" id="noBtn">再想想</button>
    </div>
  </div>
</section>

<!-- ══════════ 场景 5：结局 ══════════ -->
<section class="scene" id="sceneFinal">
  <div class="card">
    <div class="envelope">🎉</div>
    <div class="finalTitle" id="finalTitle">我就知道 ❤️</div>
    <p class="finalText" id="finalText"></p>
    <div class="stamp">
      <div class="names" id="stampNames"></div>
      <div id="stampDate"></div>
      <div style="margin-top:8px">截图保存这一刻，以后每年都翻出来看看 📸</div>
    </div>
    <button class="btn ghost" id="replayBtn" style="margin-top:20px">再看一遍 ↺</button>
  </div>
</section>

<div class="hint">Made with ❤️</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ★★★  配置区：想改什么，改这里就够了  ★★★
   ═══════════════════════════════════════════════════════════ */
const CONFIG = {
  // 她的名字 / 你的名字
  to:   '小可爱',
  from: '我',

  // 开场标题
  introTitle: '有一封信，只写给你',

  // 情书内容（一段一行，会逐字打出来）
  introLines: [
    '嗨，{to}……',
    '有些话，我在心里排练过很多遍了。',
    '每次你笑起来的时候，我都觉得世界安静了一秒。',
    '和你聊天的那几分钟，是我一天里最舍不得结束的部分。',
    '我想要的不是路过你，而是站在你身边。',
  ],

  // 表白问题
  question: '你愿意，做我的女朋友吗？',

  // 「再想想」按钮的逃跑台词（按顺序循环）
  noTexts: [
    '再想想',
    '确定不再想想？',
    '真的不再想想？',
    '我会难过的…',
    '求你了…',
    '这个按钮坏掉了 😢',
  ],

  // ── 背景音乐 ──
  // 把歌曲文件放到和 index.html 同一个文件夹，命名 bgm.mp3，就会自动播放这首歌。
  // 如果找不到这个文件，会自动回退到内置的合成轻音乐（所以删掉这行也不会没声音）。
  bgmFile:   'bgm.mp3',   // 也可以换成 '我们俩.mp3' 等任意文件名；填 '' 表示只用内置音乐
  bgmVolume: 0.6,         // 歌曲音量 0~1

  // ── 小游戏难度（想让对方轻松过关就调低一点）──
  gameGoal:  12,   // 需要接住多少颗爱心才过关
  gameTime:  30,   // 限时（秒）
  gameLives: 3,    // 最多能接到几颗「碎裂的心」

  // 结局文案
  finalTitle: '我就知道 ❤️',
  finalText: '谢谢你愿意。\n从今天开始，你的快乐我承包一半，\n你的难过我也陪你一半。\n以后的每一段路，都想和你一起走 🐾',
};
/* ═══════════════════════ 配置区结束 ═══════════════════════ */


/* ── 支持用网址参数临时改名字：index.html?to=小美&from=小明 ── */
(function applyUrlParams(){
  const p = new URLSearchParams(location.search);
  if (p.get('to'))   CONFIG.to   = p.get('to');
  if (p.get('from')) CONFIG.from = p.get('from');
})();

const T = (s) => s.replace(/\{to\}/g, CONFIG.to).replace(/\{from\}/g, CONFIG.from);
const wait = (ms) => new Promise(r => setTimeout(r, ms));

/* ══════════════ 画布：星空 + 爱心粒子 ══════════════ */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

const stars = [];
const ambient = [];   // 背景缓缓上升的爱心
const bursts  = [];   // 烟花粒子

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildStars();
}
function buildStars(){
  stars.length = 0;
  const n = Math.round(W * H / 9000);
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + .3,
      a: Math.random() * .7 + .2,
      sp: Math.random() * .02 + .006,
      ph: Math.random() * Math.PI * 2
    });
  }
}
window.addEventListener('resize', resize);

/* 画一个爱心 */
function heart(c, x, y, s, rot, color, alpha){
  c.save();
  c.translate(x, y);
  c.rotate(rot || 0);
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, 0);
  c.bezierCurveTo(0, -s * .5, -s, -s * .55, -s, s * .3);
  c.bezierCurveTo(-s, s * .95, 0, s * 1.35, 0, s * 1.85);
  c.bezierCurveTo(0, s * 1.35, s, s * .95, s, s * .3);
  c.bezierCurveTo(s, -s * .55, 0, -s * .5, 0, 0);
  c.fill();
  c.restore();
}

function spawnAmbient(){
  if (ambient.length > 34) return;
  ambient.push({
    x: Math.random() * W,
    y: H + 30,
    s: Math.random() * 9 + 5,
    v: Math.random() * .35 + .18,
    drift: (Math.random() - .5) * .35,
    rot: (Math.random() - .5) * .5,
    a: Math.random() * .3 + .12,
    hue: Math.random() < .5 ? '#ff6b9d' : '#ffa8c5'
  });
}

function burst(x, y, count){
  for (let i = 0; i < count; i++){
    const ang = Math.random() * Math.PI * 2;
    const sp  = Math.random() * 7 + 2.5;
    bursts.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 1.6,
      s: Math.random() * 7 + 4,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .22,
      life: 1,
      decay: Math.random() * .010 + .007,
      type: Math.random() < .55 ? 'heart' : 'confetti',
      hue: ['#ff6b9d','#ffa8c5','#ffd6e8','#ff2d6f','#fff0f6','#ffc857'][(Math.random()*6)|0]
    });
  }
}

let bgTick = 0;
function loop(){
  ctx.clearRect(0, 0, W, H);
  const t = bgTick++;

  // 星星
  for (const s of stars){
    const tw = s.a + Math.sin(t * s.sp + s.ph) * .35;
    ctx.globalAlpha = Math.max(.05, tw);
    ctx.fillStyle = '#ffeaf3';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 背景爱心
  if (t % 22 === 0) spawnAmbient();
  for (let i = ambient.length - 1; i >= 0; i--){
    const p = ambient[i];
    p.y -= p.v;
    p.x += Math.sin(t * .012 + p.y * .01) * .3 + p.drift * .2;
    heart(ctx, p.x, p.y, p.s, p.rot, p.hue, p.a);
    if (p.y < -40) ambient.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  // 烟花
  for (let i = bursts.length - 1; i >= 0; i--){
    const p = bursts[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += .16;        // 重力
    p.vx *= .992;
    p.rot += p.vr;
    p.life -= p.decay;

    if (p.life <= 0 || p.y > H + 60){
      bursts.splice(i, 1);
      continue;
    }
    if (p.type === 'heart'){
      heart(ctx, p.x, p.y, p.s * .55, p.rot, p.hue, Math.max(0, p.life));
    } else {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.hue;
      ctx.fillRect(-p.s * .4, -p.s * .18, p.s * .8, p.s * .36);
      ctx.restore();
    }
  }

  requestAnimationFrame(loop);
}
resize();
loop();

/* ══════════════ 背景音乐 ══════════════
   优先播放同目录的 CONFIG.bgmFile（例如 bgm.mp3）；
   文件不存在或加载失败时，自动回退到 Web Audio 实时合成的轻音乐。
   音乐按钮对两者都生效。
*/
const Music = (() => {
  const fileEl = document.getElementById('bgm');
  let actx = null, master = null, timer = null, on = false, step = 0;
  let mode = 'none';                 // 'none' | 'file' | 'synth'

  // 页面一打开就开始预加载歌曲，这样点「开始」时能立刻响。
  // 用 try 包住：万一预加载出问题，也不能连累后面的游戏和场景逻辑
  try {
    if (fileEl && CONFIG.bgmFile){
      fileEl.src = CONFIG.bgmFile;
      fileEl.load();
    }
  } catch (err){
    console.warn('背景音乐预加载失败（不影响页面）:', err);
  }

  /* ───────── 内置音乐：怀旧木吉他 ─────────
     用 Karplus-Strong 物理建模合成拨弦音色（噪声脉冲 + 延迟线 + 均值滤波）。
     注意：不能在 Web Audio 里直接搭延迟反馈回路——规范规定回路中的
     DelayNode 最小延迟为 128 采样，会导致 375Hz 以上的音全部走音。
     所以这里在 JS 里把拨弦波形渲染成 AudioBuffer，再按时间点播放。
     和声进行与分解和弦均为原创，不涉及任何现有歌曲的旋律。          */

  const TEMPO  = 62;                 // BPM，慢一点更有旧时光的感觉
  const EIGHTH = 60 / TEMPO / 2;     // 一个八分音符的秒数

  // 四小节循环：Cmaj7 → Am7 → Fmaj7 → G
  // bass 用真实吉他的低把位音（C3 / A2 / F2 / G2）
  const PROG = [
    { bass: 130.81, arp: [329.63, 392.00, 493.88, 659.25] }, // Cmaj7
    { bass: 110.00, arp: [329.63, 392.00, 523.25, 659.25] }, // Am7
    { bass:  87.31, arp: [349.23, 440.00, 523.25, 698.46] }, // Fmaj7
    { bass:  98.00, arp: [293.66, 392.00, 493.88, 587.33] }, // G
  ];
  const ARP = [0, 1, 2, 3, 2, 1, 2]; // 第 1 拍拨低音，其余 7 个八分音符的分解顺序

  let bus = null, nextStepTime = 0;
  const pluckCache = new Map();

  // 生成一段衰减噪声，当作房间混响的脉冲响应
  function makeIR(seconds, decay){
    const len = Math.floor(actx.sampleRate * seconds);
    const buf = actx.createBuffer(2, len, actx.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  /* Karplus-Strong：把一根弦的振动渲染成一段音频波形（同样的音只渲染一次）
     用分数延迟 + 线性插值，保证音高精确；若用整数延迟，高音会偏低约 10 音分 */
  function renderPluck(freq, dur){
    const key = freq.toFixed(2) + '|' + dur.toFixed(2);
    if (pluckCache.has(key)) return pluckCache.get(key);

    const sr  = actx.sampleRate;
    const len = Math.floor(sr * dur);
    const buf = actx.createBuffer(1, len, sr);
    const out = buf.getChannelData(0);

    // 延迟线长度 = 弦的振动周期。均值滤波会额外带来 0.5 个采样的延迟，所以要减掉
    const D    = Math.max(2, sr / freq - 0.5);
    const size = Math.ceil(D) + 2;
    const line = new Float32Array(size);
    for (let i = 0; i < size; i++) line[i] = Math.random() * 2 - 1;  // 拨片触弦的噪声激励

    const decay = 0.998;         // 每经过一个周期的衰减量（越大余音越长）
    let idx = 0, prev = 0, peak = 0;

    for (let i = 0; i < len; i++){
      // 读取 D 个采样之前的值，用线性插值实现分数延迟
      const rp = idx + size - D;
      const f0 = Math.floor(rp);
      const i0 = ((f0 % size) + size) % size;
      const i1 = (i0 + 1) % size;
      const fr = rp - f0;
      const delayed = line[i0] + (line[i1] - line[i0]) * fr;

      // 相邻两点取平均 → 高次谐波衰减更快，正是真实琴弦的听感
      line[idx] = 0.5 * (delayed + prev) * decay;
      prev = delayed;
      out[i] = delayed;

      const a = delayed < 0 ? -delayed : delayed;
      if (a > peak) peak = a;
      idx = (idx + 1) % size;
    }

    // 归一化 + 收尾淡出，避免缓冲结束时的爆音
    const norm = peak > 0 ? 0.9 / peak : 1;
    const fade = Math.min(len, Math.floor(sr * 0.15));
    for (let i = 0; i < len; i++){
      let v = out[i] * norm;
      if (i > len - fade) v *= (len - i) / fade;
      out[i] = v;
    }

    pluckCache.set(key, buf);
    return buf;
  }

  /* 拨一根弦 */
  function pluck(freq, time, dur, vol){
    const src = actx.createBufferSource();
    src.buffer = renderPluck(freq, dur);

    const g = actx.createGain();
    g.gain.value = vol;

    src.connect(g);
    g.connect(bus);
    src.start(time);

    setTimeout(() => { try { g.disconnect(); src.disconnect(); } catch (e){} },
      Math.max(0, (time - actx.currentTime + dur + 0.2) * 1000));
  }

  function scheduleStep(i, time){
    const bar = Math.floor(i / 8) % PROG.length;
    const pos = i % 8;
    const ch  = PROG[bar];

    // 轻微的时间与力度浮动，听起来像人在弹而不是机器在跑
    const t = time + (Math.random() - 0.5) * 0.014;

    if (pos === 0){                                  // 第 1 拍：低音弦 + 高音
      pluck(ch.bass,   t,        3.0, 0.30);
      pluck(ch.arp[0], t + 0.005, 2.4, 0.15);
    } else if (pos === 4){                           // 第 3 拍：低音弦再来一次
      pluck(ch.bass,   t,        2.6, 0.22);
      pluck(ch.arp[2], t + 0.005, 2.2, 0.14);
    } else {                                         // 其余八分音符：分解和弦
      pluck(ch.arp[ARP[(pos - 1) % ARP.length]], t, 2.2, 0.13 + Math.random() * 0.05);
    }

    // 每两小节收尾时透出一个高音，像泛音
    if (pos === 6 && bar % 2 === 1) pluck(ch.arp[3] * 2, t + 0.012, 2.8, 0.07);
  }

  // 提前 0.4 秒排程，避免 setInterval 抖动导致节奏不稳
  function scheduler(){
    if (!actx) return;
    while (nextStepTime < actx.currentTime + 0.4){
      scheduleStep(step, nextStepTime);
      nextStepTime += EIGHTH;
      step++;
    }
  }

  function synthStart(){
    try{
      if (!actx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        actx = new AC();

        bus = actx.createBiquadFilter();      // 柔化高频，木头味更足
        bus.type = 'lowpass';
        bus.frequency.value = 5200;
        bus.Q.value = 0.4;

        const dry  = actx.createGain(); dry.gain.value = 0.85;
        const conv = actx.createConvolver();
        conv.buffer = makeIR(2.4, 2.6);       // 房间混响
        const wet  = actx.createGain(); wet.gain.value = 0.30;

        master = actx.createGain();
        master.gain.value = 0.0;

        const comp = actx.createDynamicsCompressor();  // 防止叠加削波
        comp.threshold.value = -14;
        comp.knee.value = 14;
        comp.ratio.value = 4;
        comp.attack.value = 0.005;
        comp.release.value = 0.25;

        bus.connect(dry);  dry.connect(master);
        bus.connect(conv); conv.connect(wet); wet.connect(master);
        master.connect(comp); comp.connect(actx.destination);
      }

      if (actx.state === 'suspended') actx.resume();
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setValueAtTime(master.gain.value, actx.currentTime);
      master.gain.linearRampToValueAtTime(0.85, actx.currentTime + 2.0);

      if (!timer){
        nextStepTime = actx.currentTime + 0.12;
        timer = setInterval(scheduler, 90);
      }
      return true;
    } catch (err){
      console.warn('内置音乐启动失败（不影响使用）:', err);
      return false;
    }
  }

  function synthStop(){
    if (!actx) return;
    master.gain.cancelScheduledValues(actx.currentTime);
    master.gain.setValueAtTime(master.gain.value, actx.currentTime);
    master.gain.linearRampToValueAtTime(0.0, actx.currentTime + 0.6);
    clearInterval(timer); timer = null;
  }

  /* ───────── 外部歌曲文件 ───────── */
  function fadeTo(el, target, ms){
    const from = el.volume, t0 = performance.now();
    (function run(){
      const k = Math.min(1, (performance.now() - t0) / ms);
      el.volume = Math.max(0, Math.min(1, from + (target - from) * k));
      if (k < 1) requestAnimationFrame(run);
    })();
  }

  function playFile(){
    return new Promise((resolve) => {
      if (!fileEl || !CONFIG.bgmFile) return resolve(false);

      let settled = false;
      const finish = (ok) => { if (!settled){ settled = true; resolve(ok); } };

      const onReady = () => {
        if (settled) return;
        fileEl.volume = 0;
        const p = fileEl.play();
        if (p && typeof p.then === 'function'){
          p.then(() => { fadeTo(fileEl, CONFIG.bgmVolume, 1600); finish(true); })
           .catch(() => finish(false));
        } else {
          fadeTo(fileEl, CONFIG.bgmVolume, 1600);
          finish(true);
        }
      };

      fileEl.addEventListener('error', () => finish(false), { once: true });
      fileEl.addEventListener('canplaythrough', onReady, { once: true });

      if (fileEl.readyState >= 3) onReady();          // 已经加载好了
      else if (fileEl.readyState === 0) fileEl.load(); // 还没开始加载

      setTimeout(() => finish(false), 5000);           // 5 秒还不行就先用内置音乐
    });
  }

  function fallbackToSynth(){
    mode = 'synth';
    on = synthStart();
    console.log(on ? '♪ 背景音乐：未找到歌曲文件，使用内置合成音乐'
                  : '♪ 背景音乐：播放失败（不影响页面使用）');
    return on;
  }

  function useFile(){
    mode = 'file';
    on = true;
    console.log('♪ 背景音乐：正在播放 ' + CONFIG.bgmFile);
    return true;
  }

  /* 注意：start() 会在点击事件里被同步调用。
     「歌曲已预加载完成」这条分支必须在任何 await 之前执行完，
     否则会脱离浏览器的用户手势窗口，iOS / 微信里就会播放失败。 */
  function start(){
    if (on) return Promise.resolve(true);

    // 之前已经在用歌曲：直接继续放
    if (mode === 'file'){
      fileEl.volume = CONFIG.bgmVolume;
      const p = fileEl.play();
      return (p && typeof p.then === 'function')
        ? p.then(() => { on = true; return true; }).catch(() => false)
        : Promise.resolve(true);
    }
    if (mode === 'synth'){ on = synthStart(); return Promise.resolve(on); }

    // 首次播放：歌曲已经预加载好了 → 立刻同步播放
    if (CONFIG.bgmFile && fileEl && fileEl.readyState >= 3){
      fileEl.volume = 0;
      const p = fileEl.play();
      if (p && typeof p.then === 'function'){
        return p.then(() => { fadeTo(fileEl, CONFIG.bgmVolume, 1600); return useFile(); })
                .catch(() => fallbackToSynth());
      }
      fadeTo(fileEl, CONFIG.bgmVolume, 1600);
      return Promise.resolve(useFile());
    }

    // 歌曲还没加载好（或没配置）→ 异步等它，等不到就用内置音乐
    return playFile().then(ok => ok ? useFile() : fallbackToSynth());
  }

  function stop(){
    if (mode === 'file' && fileEl){
      fadeTo(fileEl, 0, 400);
      setTimeout(() => { try { fileEl.pause(); } catch (e){} }, 430);
    }
    if (mode === 'synth') synthStop();
    on = false;
  }

  return {
    async toggle(){ if (on){ stop(); return false; } return await start(); },
    start(){ return start(); },
    isOn(){ return on; },
    mode(){ return mode; }
  };
})();

const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', () => {
  try {
    const p = Music.toggle();
    if (p && typeof p.then === 'function'){
      p.then((playing) => {
        musicBtn.textContent = playing ? '🎵' : '🔇';
        musicBtn.classList.toggle('paused', !playing);
      }).catch((err) => console.warn('音乐切换失败:', err));
    }
  } catch (err){
    console.warn('音乐切换异常:', err);
  }
});

  document.getElementById(id).classList.add('active');

/* ══════════════ 打字机 ══════════════ */
async function typeInto(el, text, speed){
  for (let i = 0; i < text.length; i++){
    el.textContent = text.slice(0, i + 1);
    // 标点处稍微停顿，读起来更有呼吸感
    const ch = text[i];
    let d = speed;
    if ('，、'.includes(ch)) d = speed * 5;
    if ('。！？…'.includes(ch)) d = speed * 9;
    await wait(d);
  }
}

/* ══════════════ 小游戏：接住我的心 ══════════════ */
const Game = (() => {
  const cv   = document.getElementById('gameCanvas');
  const g    = cv.getContext('2d');
  const mask      = document.getElementById('gameMask');
  const maskTitle = document.getElementById('maskTitle');
  const maskText  = document.getElementById('maskText');
  const maskBtn   = document.getElementById('maskBtn');
  const hudScore  = document.getElementById('hudScore');
  const hudTime   = document.getElementById('hudTime');
  const lifeRow   = document.getElementById('lifeRow');
  const hudGoal   = document.getElementById('hudGoal');
  const tipGoal   = document.getElementById('tipGoal');

  const GOAL = CONFIG.gameGoal, DURATION = CONFIG.gameTime, LIVES = CONFIG.gameLives, BASKET_TOP_OFFSET = 30;

  let W = 0, H = 0, DPR = 1;
  let items = [], sparks = [];
  let basketX = 0, targetX = 0, basketW = 84;
  let score = 0, lives = LIVES, timeLeft = DURATION;
  let phase = 'idle';            // idle | playing | won | lost
  let raf = null, last = 0, spawnTimer = 0, spawnGap = 760, clock = 0;
  const keys = new Set();

  hudGoal.textContent = GOAL;
  tipGoal.textContent = GOAL;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width  = Math.max(1, Math.floor(W * DPR));
    cv.height = Math.max(1, Math.floor(H * DPR));
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    basketW = Math.max(62, Math.min(98, W * 0.21));
    if (!basketX) basketX = W / 2;
    basketX = clampX(basketX);
    targetX = basketX;
  }
  const clampX = (x) => Math.min(Math.max(x, basketW / 2), Math.max(basketW / 2, W - basketW / 2));
  const basketTop = () => H - BASKET_TOP_OFFSET;

  window.addEventListener('resize', resize);

  function updateHud(){
    hudScore.textContent = score;
    hudTime.textContent  = Math.max(0, Math.ceil(timeLeft));
    lifeRow.textContent  = '❤'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, LIVES - lives));
    lifeRow.style.color  = lives <= 1 ? '#ff5c8a' : '#ffb3cd';
  }

  function reset(){
    items = []; sparks = [];
    score = 0; lives = LIVES; timeLeft = DURATION;
    spawnTimer = 400; spawnGap = 760; clock = 0;
    resize();
    basketX = targetX = W / 2;
    updateHud();
  }

  function spawn(){
    const r = Math.random();
    let kind = 'heart';
    if (clock > 4 && r < 0.26) kind = 'broken';
    else if (r > 0.90)         kind = 'gold';

    items.push({
      x: 26 + Math.random() * Math.max(1, W - 52),
      y: -30,
      vy: 100 + Math.random() * 60 + clock * 3.6,
      vx: (Math.random() - .5) * 34,
      size: kind === 'gold' ? 12 : 10.5,
      rot: (Math.random() - .5) * .5,
      vr: (Math.random() - .5) * 1.1,
      ph: Math.random() * Math.PI * 2,
      kind
    });
  }

  function addSparks(x, y, color, n){
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, s = Math.random() * 130 + 40;
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 1, color, r: Math.random() * 2.4 + 1.2 });
    }
  }

  function drawHeartItem(it){
    if (it.kind === 'broken'){
      heart(g, it.x, it.y - it.size * .7, it.size, it.rot, '#5f7091', .9);
      g.save();
      g.translate(it.x, it.y - it.size * .7);
      g.rotate(it.rot);
      g.strokeStyle = 'rgba(14,7,24,.9)';
      g.lineWidth = 1.7;
      g.beginPath();
      g.moveTo(0, -it.size * .35);
      g.lineTo(-it.size * .28, it.size * .45);
      g.lineTo(it.size * .22, it.size * .85);
      g.lineTo(-it.size * .12, it.size * 1.55);
      g.stroke();
      g.restore();
      return;
    }
    if (it.kind === 'gold'){
      g.save();
      g.globalAlpha = .3;
      g.fillStyle = '#ffc857';
      g.beginPath();
      g.arc(it.x, it.y + it.size * .35, it.size * 2.1, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }
    const col = it.kind === 'gold' ? '#ffc857' : (it.kind === 'broken' ? '#5f7091' : '#ff4f8b');
    heart(g, it.x, it.y - it.size * .7, it.size, it.rot, col, 1);
  }

  function drawBasket(){
    const y = basketTop();
    const x = basketX - basketW / 2;

    g.save();
    g.shadowColor = 'rgba(255,79,139,.85)';
    g.shadowBlur = 22;
    const grd = g.createLinearGradient(0, y, 0, y + 18);
    grd.addColorStop(0, '#ff9dc0');
    grd.addColorStop(1, '#e5306e');
    g.fillStyle = grd;
    g.beginPath();
    // 圆角篮子
    const h = 13, r = 6.5;
    g.moveTo(x + r, y);
    g.lineTo(x + basketW - r, y);
    g.quadraticCurveTo(x + basketW, y, x + basketW, y + r);
    g.lineTo(x + basketW, y + h - r);
    g.quadraticCurveTo(x + basketW, y + h, x + basketW - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
    g.fill();
    g.restore();

    // 篮子上的两颗小心
    heart(g, basketX - 12, y - 9, 4.2, 0, '#ffd6e8', .95);
    heart(g, basketX + 12, y - 9, 4.2, 0, '#ffd6e8', .95);
  }

  function frame(now){
    if (phase !== 'playing') return;
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    clock += dt;
    timeLeft -= dt;

    if (keys.has('ArrowLeft'))  targetX -= 520 * dt;
    if (keys.has('ArrowRight')) targetX += 520 * dt;
    targetX = clampX(targetX);
    basketX += (targetX - basketX) * Math.min(1, dt * 16);

    spawnTimer -= dt * 1000;
    if (spawnTimer <= 0){
      spawn();
      spawnGap = Math.max(370, spawnGap - 20);
      spawnTimer = spawnGap;
    }

    const top = basketTop();
    for (let i = items.length - 1; i >= 0; i--){
      const it = items[i];
      it.y += it.vy * dt;
      it.x += it.vx * dt + Math.sin(clock * 2.2 + it.ph) * 22 * dt;
      it.rot += it.vr * dt;

      const cy = it.y + it.size * .35;
      const caught = cy >= top - 6 && cy <= top + 24 &&
                     Math.abs(it.x - basketX) <= basketW / 2 + it.size * .7;

      if (caught){
        if (it.kind === 'heart'){ score += 1; addSparks(it.x, top, '#ff6b9d', 12); }
        else if (it.kind === 'gold'){ score += 3; addSparks(it.x, top, '#ffc857', 20); }
        else {
          lives -= 1;
          addSparks(it.x, top, '#5f7091', 14);
          lifeRow.animate(
            [{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }],
            { duration: 260 }
          );
        }
        items.splice(i, 1);
        updateHud();
        continue;
      }
      if (it.y > H + 60) items.splice(i, 1);
    }

    for (let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vy += 260 * dt; s.vx *= .97;
      s.life -= dt * 2.1;
      if (s.life <= 0) sparks.splice(i, 1);
    }

    updateHud();

    /* ── 绘制 ── */
    g.clearRect(0, 0, W, H);

    for (const it of items) drawHeartItem(it);

    for (const s of sparks){
      g.globalAlpha = Math.max(0, s.life);
      g.fillStyle = s.color;
      g.beginPath(); g.arc(s.x, s.y, s.r * s.life + .6, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;

    drawBasket();

    // 目标进度条
    const pw = W - 40;
    g.fillStyle = 'rgba(255,255,255,.10)';
    g.fillRect(20, 12, pw, 4);
    g.fillStyle = '#ff6b9d';
    g.fillRect(20, 12, pw * Math.min(1, score / GOAL), 4);

    if (score >= GOAL) return win();
    if (lives <= 0)    return lose('心都碎光了 💔');
    if (timeLeft <= 0) return lose('时间到啦 ⏰');
    raf = requestAnimationFrame(frame);
  }

  function showMask(title, textHtml, btnText){
    maskTitle.innerHTML = title;
    maskText.innerHTML  = textHtml;
    maskBtn.textContent = btnText;
    mask.classList.add('show');
  }
  function hideMask(){ mask.classList.remove('show'); }

  function start(){
    reset();
    phase = 'playing';
    hideMask();
    cancelAnimationFrame(raf);
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function win(){
    phase = 'won';
    cancelAnimationFrame(raf);
    showMask('全部都接住啦 ✨',
      '你的心意，我收到了。<br>现在，去拆那封信吧。', '拆信 ✉️');
    for (let i = 0; i < 3; i++){
      setTimeout(() => burst(W * (.25 + Math.random() * .5), H * (.2 + Math.random() * .3), 55), i * 220);
    }
  }

  function lose(reason){
    phase = 'lost';
    cancelAnimationFrame(raf);
    showMask(reason,
      '别灰心，我的爱又不是这么容易就会碎的。<br>再来一次吧 👇', '再来一次');
  }

  maskBtn.addEventListener('click', () => {
    if (phase === 'won'){
      hideMask();
      go('sceneLetter');
      playLetter();
    } else {
      start();
    }
  });

  /* 控制：鼠标 / 触摸 / 方向键 */
  cv.addEventListener('pointermove', (e) => {
    const r = cv.getBoundingClientRect();
    targetX = clampX(e.clientX - r.left);
  });
  cv.addEventListener('pointerdown', (e) => {
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    const r = cv.getBoundingClientRect();
    targetX = clampX(e.clientX - r.left);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keys.add(e.key);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key));

  return {
    begin(){ go('sceneGame'); reset(); phase = 'idle'; showMask('帮我接住这些心 🧺', '移动鼠标 / 手指，或按 ← → 键来移动篮子。<br>接住 <b>爱心</b> 得分，别接 <b>碎裂的心</b> 哦。', '开始'); },
    abort(){ phase = 'idle'; cancelAnimationFrame(raf); },
    resetAll(){ reset(); phase = 'idle'; }
  };
})();

/* ══════════════ 流程控制 ══════════════ */
const openBtn   = document.getElementById('openBtn');
const toAskBtn  = document.getElementById('toAskBtn');
const letterBox = document.getElementById('letterBox');

document.getElementById('introTitle').textContent = CONFIG.introTitle;
document.getElementById('askText').textContent = CONFIG.question;
document.getElementById('finalTitle').textContent = CONFIG.finalTitle;

async function playLetter(){
  go('sceneLetter');
  letterBox.innerHTML = '';
  await wait(500);

  for (const raw of CONFIG.introLines){
    const text = T(raw);
    const p = document.createElement('p');
    p.className = 'line';
    const span = document.createElement('span');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    p.appendChild(span);
    p.appendChild(cursor);
    letterBox.appendChild(p);

    await wait(120);
    await typeInto(span, text, 62);
    await wait(380);
    cursor.remove();
    letterBox.scrollTop = letterBox.scrollHeight;
  }

  await wait(400);
  toAskBtn.style.display = 'inline-flex';
}

openBtn.addEventListener('click', () => {
  // 先无条件推进流程：不管音乐出什么问题，这个按钮都必须有反应
  Game.begin();

  // 再尝试启动音乐。必须在这个点击的手势里同步发起，否则浏览器会拒绝播放
  try {
    const p = Music.start();
    if (p && typeof p.then === 'function'){
      p.then((playing) => {
        musicBtn.textContent = playing ? '🎵' : '🔇';
        musicBtn.classList.toggle('paused', !playing);
      }).catch((err) => { console.warn('音乐启动失败（不影响页面）:', err); });
    }
  } catch (err){
    console.warn('音乐启动异常（不影响页面）:', err);
  }
});

toAskBtn.addEventListener('click', () => {
  go('sceneAsk');
});

/* ── 「再想想」按钮：会逃跑，会变小，会说软话 ── */
const noBtn  = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
let dodge = 0;

function dodgeNo(){
  dodge++;
  const text = CONFIG.noTexts[Math.min(dodge, CONFIG.noTexts.length - 1)];
  noBtn.textContent = text;

  // 长大后先转为固定定位，才能在整屏乱跑
  if (!noBtn.classList.contains('fixed')){
    const r = noBtn.getBoundingClientRect();
    noBtn.style.width = r.width + 'px';
    noBtn.style.height = r.height + 'px';
    noBtn.classList.add('fixed');
  }

  const pad = 14;
  const w = noBtn.offsetWidth || 110;
  const h = noBtn.offsetHeight || 46;
  const maxX = Math.max(pad, window.innerWidth  - w - pad);
  const maxY = Math.max(pad, window.innerHeight - h - pad);
  const x = pad + Math.random() * (maxX - pad);
  const y = pad + Math.random() * (maxY - pad);

  const scale = Math.max(0.42, 1 - dodge * 0.11);
  noBtn.style.left = x + 'px';
  noBtn.style.top  = y + 'px';
  noBtn.style.transform = 'scale(' + scale + ') rotate(' + (Math.random()*20-10).toFixed(1) + 'deg)';

  // 「愿意」越来越大，越来越闪
  yesBtn.style.transform = 'scale(' + Math.min(1.5, 1 + dodge * 0.09) + ')';
  yesBtn.style.fontSize  = Math.min(23, 17 + dodge * 0.9) + 'px';
  yesBtn.style.padding   = (15 + dodge * 1.2) + 'px ' + (40 + dodge * 2) + 'px';

  // 最后彻底跑不动了
  if (dodge >= 6){
    noBtn.style.pointerEvents = 'none';
    noBtn.style.opacity = '0';
    noBtn.textContent = '好吧，你赢了';
  }
}

['mouseenter', 'touchstart', 'click'].forEach(ev => {
  noBtn.addEventListener(ev, (e) => {
    e.preventDefault();
    if (dodge >= 6) return;
    dodgeNo();
  }, { passive: false });
});

/* ── 「愿意」：结局 + 满屏爱心烟花 ── */
const finalText = document.getElementById('finalText');
const stampNames = document.getElementById('stampNames');
const stampDate = document.getElementById('stampDate');

function todayStr(){
  const d = new Date();
  return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
}

yesBtn.addEventListener('click', async () => {
  go('sceneFinal');

  finalText.innerHTML = T(CONFIG.finalText).split('\n').map(l => l || '&nbsp;').join('<br>');
  stampNames.textContent = CONFIG.from + '  ❤  ' + CONFIG.to;
  stampDate.textContent = '纪念日 · ' + todayStr();

  // 连续放几波烟花
  const waves = 6;
  for (let i = 0; i < waves; i++){
    setTimeout(() => {
      burst(
        W * (0.15 + Math.random() * 0.7),
        H * (0.18 + Math.random() * 0.45),
        70
      );
    }, i * 260);
  }
  // 之后再来一段持续的小烟花
  let extra = 0;
  const iv = setInterval(() => {
    burst(Math.random() * W, H * (0.15 + Math.random() * 0.5), 35);
    if (++extra > 6) clearInterval(iv);
  }, 900);
});

/* ── 重来 ── */
document.getElementById('replayBtn').addEventListener('click', () => {
  dodge = 0;
  noBtn.classList.remove('fixed');
  noBtn.style.cssText = '';
  noBtn.textContent = CONFIG.noTexts[0];
  yesBtn.style.cssText = '';
  bursts.length = 0;
  letterBox.innerHTML = '';
  toAskBtn.style.display = 'none';
  Game.abort();
  Game.resetAll();
  go('sceneIntro');
});

/* ── 键盘小彩蛋：空格直接进入下一幕 ── */
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (document.getElementById('sceneIntro').classList.contains('active')){
    openBtn.click();
  } else if (document.getElementById('sceneLetter').classList.contains('active')){
    if (toAskBtn.style.display !== 'none') toAskBtn.click();
  }
});
</script>
